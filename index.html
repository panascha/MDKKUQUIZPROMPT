 NNT for aspirin = 50,
 NNT for statins = 61.
 Which of the following best explains why influenza vaccination should be considered essential to cardiovascular prevention?"		The NNT for flu vaccination is too high to justify widespread use.///It has a lower NNT than aspirin and statins, meaning fewer patients need to be treated for one to benefit.///Flu vaccination is primarily for respiratory health, and its cardiovascular benefits are insignificant.///Since it prevents MACE, it can be used instead of standard cardiovascular medications.///It directly lowers cholesterol and blood pressure, preventing heart attacks.	It has a lower NNT than aspirin and statins, meaning fewer patients need to be treated for one to benefit.	ค่า NNT (Number Needed to Treat) ยิ่งต่ำยิ่งแสดงว่ามาตรการนั้นมีประสิทธิภาพสูง เพราะต้องรักษาคนจำนวนน้อยกว่าเพื่อป้องกันเหตุการณ์เลวร้ายได้ 1 ครั้ง ในที่นี้ NNT ของวัคซีนไข้หวัดใหญ่ (19) ต่ำกว่า Aspirin (50) และ Statins (61) จึงถือเป็นกลยุทธ์ที่มีประสิทธิภาพมาก ส่วนข้อ D ผิดเพราะวัคซีนไม่ได้ใช้ทดแทนยามาตรฐาน และข้อ E ผิดเพราะกลไกไม่ใช่การลดไขมันโดยตรงแต่เป็นการลด Inflammation และ Sympathetic stress จากการติดเชื้อ	["COMMED_52FMT"]
COMMED_52FMT_7	7. A research team conducted a study comparing the complication rates of a new drug versus a current treatment. The study found that: New drug group (Experienced 10, No complications 90), Control group (Experienced 30, No complications 70). How many patients need to be treated with the new drug to prevent one additional complication?	https://drive.google.com/uc?export=view&id=1aokhpTOjaDc14oyr9_Oz-upTD65raojq	30///5///40///20///10	5	การหา NNT เริ่มจากคำนวณ Absolute Risk Reduction (ARR): Risk กลุ่มควบคุม = 30/100 (0.3), Risk กลุ่มยาใหม่ = 10/100 (0.1). ดังนั้น ARR = 0.3 - 0.1 = 0.2. สูตร NNT = 1 / ARR = 1 / 0.2 = 5. หมายความว่าต้องให้ยาใหม่ในผู้ป่วย 5 คน เพื่อป้องกันภาวะแทรกซ้อนได้เพิ่มขึ้น 1 ราย เมื่อเทียบกับยาเดิม	["COMMED_52FMT"]
COMMED_52FMT_8	8. A study comparing two pain relief treatments finds that participants in the treatment group reported better pain relief. However, it is noted that the research staff frequently interacted with the treatment group, offering additional encouragement, which may have influenced the results. This is an example of:?		Detection bias///Confounding bias///Confirmation bias///Information bias///Selection bias	Information bias	การที่เจ้าหน้าที่วิจัยมีการปฏิสัมพันธ์หรือให้กำลังใจกลุ่มที่ได้รับการรักษามากกว่าปกติ ทำให้การวัดผลลัพธ์ (Pain relief) คลาดเคลื่อนไปจากความเป็นจริง ถือเป็น Information bias (หรือในระดับย่อยคือ Performance bias/Hawthorne effect) ส่วน Selection bias (ข้อ E) คือความคลาดเคลื่อนจากการคัดเลือกกลุ่มตัวอย่าง และ Confounding (ข้อ B) คือปัจจัยภายนอกที่สัมพันธ์ทั้งเหตุและผลแต่ไม่ใช่ส่วนหนึ่งของเส้นทางสาเหตุหลัก	["COMMED_52FMT"]
COMMED_52FMT_9	9. An ecological study is primarily characterized by:?		Comparing individual-level data between groups///Randomly assigning interventions to individuals///Conducting randomization of individuals into groups///Examining group-level data rather than individual-level data///Collecting qualitative data to understand participants' experiences	Examining group-level data rather than individual-level data	Ecological study (การศึกษาเชิงนิเวศ) คือการศึกษาที่ใช้หน่วยวิเคราะห์เป็น ระดับกลุ่ม (Population/Group level) เช่น การเปรียบเทียบอัตราการตายด้วยโรคมะเร็งกับปริมาณการบริโภคไขมันในระดับประเทศ โดยไม่ได้เก็บข้อมูลรายบุคคล ส่วนข้อ A, B, และ C เป็นลักษณะของการศึกษาแบบ Cohort, Case-control หรือ RCT ที่เน้นข้อมูลรายบุคคล (Individual level)	["COMMED_52FMT"]
COMMED_52FMT_10	10. How does using Relative Risk Reduction (RRR) alone affect the interpretation of the drug’s effectiveness?		RRR and ARR give the same result///Overestimates the benefit///Underestimates the benefit///Ignores differences between individual patients///Provides the most accurate measure	Overestimates the benefit	การรายงานค่า RRR เพียงอย่างเดียวมักทำให้ผู้คน Overestimate (ประเมินผลดีเกินจริง) เนื่องจาก RRR ไม่ได้คำนึงถึงความเสี่ยงพื้นฐาน (Baseline risk) เช่น ยาที่ลดความเสี่ยงจาก 2% เหลือ 1% กับ ยาที่ลดจาก 0.002% เหลือ 0.001% ทั้งคู่มี RRR = 50% เท่ากัน แต่ความสำคัญทางคลินิกต่างกันมาก การดูควบคู่กับ Absolute Risk Reduction (ARR) จะให้ภาพที่ถูกต้องกว่า	["COMMED_52FMT"]
COMMED_52FMT_11	11. In a cross-sectional study, researchers find that students whose parents smoke are 3.5 times more likely to be smokers themselves, with a prevalence odds ratio (POR) of 3.5 and a 95% confidence interval (95% CI) of 2.1–5.8. What conclusion can be drawn?		The study proves a cause-effect relationship.///There is a statistically significant association between parental smoking and student smoking.///There is no relationship between parental and student smoking.///Parental smoking causes student smoking.///Cross-sectional studies can determine the direction of causality.	There is a statistically significant association between parental smoking and student smoking.	เนื่องจากค่า 95% CI (2.1-5.8) ไม่ครอบคลุมค่า 1.0 (Null value ของ Odds ratio) จึงสรุปได้ว่ามีความสัมพันธ์กันอย่างมีนัยสำคัญทางสถิติ อย่างไรก็ตาม Cross-sectional study ไม่สามารถสรุปความเป็นเหตุเป็นผล (Causality) ได้ (ตัดข้อ A และ D) และไม่สามารถระบุทิศทางความสัมพันธ์ที่แน่นอนได้ (ตัดข้อ E)	["COMMED_52FMT"]
COMMED_52FMT_12	12. In a randomized controlled trial (RCT), a researcher observes that participants in the treatment group have poor compliance with the prescribed regimen. Which of the following should the researcher do to address this issue?		Modify the treatment regimen to ensure compliance///Report only the data from participants who strictly adhered to the treatment///Exclude all non-compliant participants from the final analysis///Offer additional support, education, and reminders to improve adherence///Ignore the non-compliant participants to avoid bias	Offer additional support, education, and reminders to improve adherence	ในการทำ RCT เพื่อรักษาความตรงภายใน (Internal validity) และจำลองการใช้งานจริง ผู้วิจัยควรใช้กลยุทธ์ส่งเสริมการปฏิบัติตามแผนการรักษา เช่น การให้ความรู้หรือการเตือน (Education/Reminders) ส่วนในแง่การวิเคราะห์ข้อมูล ต้องใช้ Intention-to-treat (ITT) analysis ซึ่งห้ามตัดผู้ที่ไม่ร่วมมือออก (ตัดข้อ B, C) และห้ามแก้ Regimen ระหว่างการศึกษาเพื่อคงความมาตรฐาน (ตัดข้อ A)	["COMMED_52FMT"]
COMMED_52FMT_13	13. In a village with a total population of 2,000, about 1,000 persons were diagnosed with ischemic heart disease. Among the population, 200 people died from ischemic heart disease, and there were a total of 300 deaths from all causes during the year. What is the crude mortality rate for this village?		200 per 1,000 population///100 per 1,000 population///300 per 1,000 population///50 per 1,000 population///150 per 1,000 population	150 per 1,000 population	Crude Mortality Rate (อัตราตายอย่างหยาบ) คำนวณจาก (จำนวนผู้ตายทั้งหมด / ประชากรทั้งหมด) x ตัวทวีคูณ (เช่น 1,000). ในที่นี้คือ (300 / 2,000) x 1,000 = 150 ต่อประชากร 1,000 คน. ส่วนข้อ A เป็น Cause-specific mortality rate และข้ออื่นๆ เป็นการคำนวณที่ผิดวัตถุประสงค์	["COMMED_52FMT"]
COMMED_52FMT_14	14. In the dry season in Thailand, there’s a rise in PM2.5 in the environment due to massive farm fires. Which phenomenon is the most related to this pollution situation?		Rising of lung carcinoma incidence///Rising suicide incidence///Rising of respiratory infection incidence///Emerging of new infectious disease///Rising of myocardial infarction incidence	Rising of myocardial infarction incidence	มลพิษทางอากาศโดยเฉพาะ PM2.5 มีความสัมพันธ์อย่างมากกับการเกิด Myocardial Infarction (MI) เฉียบพลันและอัตราการเสียชีวิตจากโรคหัวใจและหลอดเลือด เนื่องจากฝุ่นขนาดเล็กสามารถเข้าสู่กระแสเลือดและกระตุ้นการอักเสบทั่วร่างกาย (Systemic inflammation) แม้ PM2.5 จะเพิ่มความเสี่ยงมะเร็งปอด (ข้อ A) และการติดเชื้อทางเดินหายใจ (ข้อ C) แต่ความสัมพันธ์กับเหตุการณ์เฉียบพลันทางหัวใจมักเป็นจุดเน้นสำคัญในการศึกษาด้านผลกระทบฉับพลันของมลพิษ	["COMMED_52FMT"]
COMMED_52FMT_15	15. Which of the following best describes the relationship between ecological studies and other types of epidemiological studies?		Ecological studies always provide stronger evidence of causal relationships than cohort or case-control studies///Ecological studies are the most accurate type of study for examining individual risk factors///Ecological studies can never be used to guide policy decisions or public health strategies///Ecological studies typically focus on individual-level data, unlike cohort or case-control studies///Ecological studies are primarily used for hypothesis generation and often serve as preliminary research to inform individual-level studies	Ecological studies are primarily used for hypothesis generation and often serve as preliminary research to inform individual-level studies	Ecological studies เป็นการศึกษาในระดับประชากรที่ทำได้รวดเร็วและประหยัด จึงนิยมใช้ในการสร้างสมมติฐาน (Hypothesis generation) เพื่อนำไปสู่การศึกษาที่ละเอียดขึ้นในระดับบุคคล เช่น Cohort หรือ Case-control ต่อไป ข้อเสียสำคัญคือ Ecological fallacy ที่ไม่สามารถนำผลระดับกลุ่มมาอ้างอิงรายบุคคลได้	["COMMED_52FMT"]
COMMED_52FMT_16	16. Which of the following Bradford Hill’s criteria refers to the principle that a cause must precede its effect in time?		Consistency///Coherence///Temporality///Biological gradient///Specificity	Temporality	Temporality (ลำดับเวลา) คือเกณฑ์ของ Bradford Hill ที่สำคัญที่สุด ซึ่งระบุว่า 'เหตุ' (Exposure) ต้องเกิดก่อน 'ผล' (Outcome) เสมอ ส่วน Consistency คือความสม่ำเสมอของผลการวิจัยในที่ต่างๆ Biological gradient คือความสัมพันธ์แบบ dose-response และ Specificity คือความจำเพาะเจาะจงของเหตุและผล	["COMMED_52FMT"]
COMMED_52FMT_17	17. Which of the following is a key advantage of a prospective cohort study over a retrospective cohort study?		Higher statistical power///Easier to study rare diseases///Less time-consuming///Reduced risk of recall bias///Lower cost	Reduced risk of recall bias	Prospective cohort study ติดตามผู้ป่วยไปข้างหน้าและเก็บข้อมูลตั้งแต่ยังไม่เกิดโรค จึงช่วยลด Recall bias (อคติจากการระลึกชาติ) ได้ดีกว่าการไปถามย้อนหลัง ส่วนข้อ B ผิดเพราะ Cohort ไม่เหมาะกับโรคหายาก ข้อ C และ E ผิดเพราะ Prospective มักใช้เวลานานและใช้เงินทุนสูงกว่า Retrospective	["COMMED_52FMT"]
COMMED_52FMT_18	18. Which of the following is true about case-control studies?		They always provide accurate estimates of disease incidence.///They require a large sample size to be effective.///They follow participants over time to measure disease occurrence.///They are efficient for studying rare diseases.///They are ideal for studying rare exposures.	They are efficient for studying rare diseases.	Case-control study เริ่มจากคนที่เป็นโรค (Cases) และคนไม่เป็นโรค (Controls) จึงเหมาะอย่างยิ่งสำหรับการศึกษา โรคที่หายาก (Rare diseases) หรือโรคที่มีระยะฟักตัวนาน ส่วนข้อ A ผิดเพราะไม่สามารถหา Incidence ได้โดยตรง ข้อ E ผิดเพราะถ้า Exposure หายาก การศึกษาแบบ Cohort จะเหมาะสมกว่า	["COMMED_52FMT"]
COMMED_52FMT_19	19. Which of the following research strategies would most likely decrease the impact of publication bias in the process of doing a systematic review?		Relying only on published studies from peer-reviewed journals///Conducting studies only in highly specialized research centers///Focusing solely on studies with large sample sizes///Limiting the review to studies published within the last 5 years///Including both published and unpublished studies in systematic reviews	Including both published and unpublished studies in systematic reviews	Publication bias เกิดจากการที่งานวิจัยที่ได้ผลนัยสำคัญ (Positive results) มีโอกาสถูกตีพิมพ์มากกว่างานวิจัยที่ได้ผลลบ (Negative results) การแก้ไขที่ตรงจุดที่สุดในการทำ Systematic review คือการค้นหาและรวบรวม Gray literature หรือ Unpublished studies มาวิเคราะห์ร่วมด้วยเพื่อลดความเอนเอียงนี้	["COMMED_52FMT"]
COMMED_52FMT_20	20. Which of the following research strategies would most likely decrease the impact of publication bias in the process of doing a systematic review?		Relying only on published studies from peer-reviewed journals///Conducting studies only in highly specialized research centers///Focusing solely on studies with large sample sizes///Limiting the review to studies published within the last 5 years///Including both published and unpublished studies in systematic reviews	Including both published and unpublished studies in systematic reviews	ซ้ำกับข้อ 19: การลด Publication bias ทำได้โดยการรวมทั้งงานวิจัยที่ตีพิมพ์และไม่ตีพิมพ์ (Unpublished studies) เข้ามาในการวิเคราะห์ เพื่อให้ได้ภาพรวมของผลลัพธ์ที่ไม่ถูกบิดเบือนจากนโยบายการรับตีพิมพ์ของวารสารที่มักเน้นผลการทดลองที่เป็นบวก	["COMMED_52FMT"]
COMMED_52FMT_21	21. การตรวจคัดกรองมะเร็งเต้านมด้วยแมมโมแกรมมีผลดังนี้: จากผู้หญิง 1,000 คน มีผู้ป่วยมะเร็งเต้านม 10 คน ผลตรวจแมมโมแกรมเป็นบวกในผู้ป่วยมะเร็ง 8 คน ผลตรวจแมมโมแกรมเป็นบวกในผู้ที่ไม่เป็นมะเร็ง 99 คน ค่า positive predictive value ของการตรวจแมมโมแกรมในกรณีนี้มีค่าเท่าใด?		8/1000///8/107///875/974///8/10///875/1000	8/107	Positive Predictive Value (PPV) คำนวณจาก (จำนวนคนที่ป่วยจริงและผลตรวจเป็นบวก / จำนวนคนที่ผลตรวจเป็นบวกทั้งหมด). จากโจทย์ คนที่เป็นบวกจริง (True Positive) = 8 คน และคนที่ผลเป็นบวกแต่ไม่ป่วย (False Positive) = 99 คน ดังนั้นผลบวกรวม = 8 + 99 = 107. ค่า PPV จึงเท่ากับ 8/107	["COMMED_52FMT"]
COMMED_52FMT_22	22. การตรวจโรคหนึ่งมี sensitivity 90% และ specificity 95% เมื่อทำการตรวจในประชากรกลุ่มที่ 1 ซึ่งมีความชุกของโรค 5% พบว่ามีค่า PPV เท่ากับ X% ถ้านำการตรวจเดียวกันนี้ไปใช้ในประชากรกลุ่มที่ 2 ซึ่งมีความชุกของโรค 20% ค่า PPV ในกลุ่มที่ 2 จะมีค่าประมาณเท่าใด?		80%///95%///48%///65%///20%	80%	เมื่อความชุก (Prevalence) เพิ่มขึ้น ค่า PPV จะเพิ่มขึ้นตาม สมมติประชากร 100 คน ในกลุ่มที่ 2 ที่มี prevalence 20% จะมีคนเป็นโรค 20 คน และไม่เป็นโรค 80 คน. ผลบวกจริง (TP) = 90% ของ 20 = 18 คน. ผลบวกลวง (FP) = 5% ของ 80 = 4 คน. PPV = 18 / (18 + 4) = 18/22 ≈ 81.8% ซึ่งใกล้เคียงที่สุดกับข้อ A (80%)	["COMMED_52FMT"]
COMMED_52FMT_23	23. การประเมินความตรงภายนอก (external validity) ของงานวิจัยทางคลินิกพิจารณาจากอะไร?		การมีกลุ่มตัวอย่างที่เป็นตัวแทนของประชากรที่ศึกษา///การควบคุมอคติในการวิจัยได้ดี///การใช้เครื่องมือวัดที่มีความแม่นยำสูง///การใช้เทคนิคทางสถิติขั้นสูง///ความสามารถในการนำผลการวิจัยไปใช้กับประชากรอื่น	ความสามารถในการนำผลการวิจัยไปใช้กับประชากรอื่น	External validity (ความตรงภายนอก) หรือ Generalizability หมายถึงความสามารถในการนำผลสรุปจากงานวิจัยไปใช้ (Apply) กับประชากรกลุ่มอื่นหรือในสถานการณ์จริงที่นอกเหนือจากกลุ่มตัวอย่างในการวิจัย ส่วนข้อ A และ B เกี่ยวข้องกับ Internal validity มากกว่า	["COMMED_52FMT"]
COMMED_52FMT_24	24. การประเมินความตรงภายใน (internal validity) ของงานวิจัยทางคลินิกพิจารณาจากอะไร?		การใช้กลุ่มตัวอย่างขนาดใหญ่///การควบคุมอคติและปัจจัยกวน///การใช้สถิติที่ไม่ซับซ้อนในการวิเคราะห์///การตีพิมพ์ในวารสารที่มี impact factor สูง///การนำผลการวิจัยไปใช้ได้กับประชากรทั่วไป	การควบคุมอคติและปัจจัยกวน	Internal validity (ความตรงภายใน) คือความน่าเชื่อถือของผลลัพธ์ในงานวิจัยนั้นๆ ว่าเป็นผลมาจากสิ่งที่ศึกษาจริงๆ หรือไม่ ซึ่งพิจารณาจากการควบคุม Bias (อคติ) และ Confounding factors (ปัจจัยกวน) ได้ดีเพียงใด ส่วนข้อ E คือ External validity	["COMMED_52FMT"]
COMMED_52FMT_25	25. การประเมินความเสี่ยงของอคติ (risk of bias) ในการทบทวนวรรณกรรมอย่างเป็นระบบ (systematic review) มีความสำคัญอย่างไร?		เป็นเพียงขั้นตอนเพื่อให้สอดคล้องกับแนวทางการรายงานผลการวิจัย///ใช้เพื่อคัดเลือกงานวิจัยที่มีขนาดกลุ่มตัวอย่างใหญ่เพียงพอ///ใช้เพื่อประเมินความเชี่ยวชาญของผู้วิจัย///ใช้เพื่อกำหนดว่าบทความใดควรถูกอ้างอิงมากที่สุด///ช่วยให้ผู้อ่านประเมินคุณภาพและความน่าเชื่อถือของหลักฐานที่นำมาสังเคราะห์	ช่วยให้ผู้อ่านประเมินคุณภาพและความน่าเชื่อถือของหลักฐานที่นำมาสังเคราะห์	การทำ Risk of Bias (RoB) assessment ใน systematic review มีไว้เพื่อตรวจสอบคุณภาพของแต่ละงานวิจัยที่นำมารวมกัน เพื่อดูว่ามีข้อบกพร่องเชิงระเบียบวิธีวิจัยที่จะทำให้ผลสรุปคลาดเคลื่อนหรือไม่ ช่วยให้ผู้อ่านตัดสินใจได้ว่าจะเชื่อถือข้อสรุปนั้นได้มากน้อยเพียงใด	["COMMED_52FMT"]
COMMED_52FMT_26	26. การพิจารณาอคติจากการตีพิมพ์ (publication bias) ในการประเมินงานวิจัย systematic review แสดงให้เห็นประเด็นในข้อใดต่อไปนี้?		บ่งชี้คุณภาพของวารสารที่ตีพิมพ์บทความ///ช่วยให้ทราบว่าบทความผ่านการทบทวนโดยผู้เชี่ยวชาญ (peer review) หรือไม่///ชี้ให้เห็นว่างานวิจัยที่ได้ผลลัพธ์เชิงบวกหรือมีนัยสำคัญทางสถิติมีโอกาสได้รับการตีพิมพ์มากกว่า///ชี้ให้เห็นว่าผู้วิจัยเลือกวิเคราะห์เฉพาะผลลัพธ์ที่สนับสนุนสมมุติฐาน///แสดงถึงความลำเอียงของผู้วิจัยในการเลือกกลุ่มตัวอย่าง	ชี้ให้เห็นว่างานวิจัยที่ได้ผลลัพธ์เชิงบวกหรือมีนัยสำคัญทางสถิติมีโอกาสได้รับการตีพิมพ์มากกว่า	Publication bias คือปรากฏการณ์ที่งานวิจัยที่มีผลการทดลองที่เป็นบวก (Positive results) มักถูกส่งไปตีพิมพ์และได้รับการยอมรับจากวารสารมากกว่างานวิจัยที่หาความสัมพันธ์ไม่เจอ (Negative results) ทำให้การทำ Systematic review อาจได้ผลลัพธ์ที่เอนเอียงไปทางด้านบวกเกินความเป็นจริง	["COMMED_52FMT"]
COMMED_52FMT_27	27. การวิเคราะห์ข้อมูลเชิงคุณภาพ การ Coding หมายถึงอะไร?		การคำนวณค่าเฉลี่ยของข้อมูล///การระบุและจัดกลุ่มข้อมูลตามธีมที่เกี่ยวข้อง///การแปลงข้อมูลเพื่อวิเคราะห์ทางสถิติ///การตรวจสอบความถูกต้องของข้อมูล///การสร้างแผนภูมิเพื่อนำเสนอข้อมูล	การระบุและจัดกลุ่มข้อมูลตามธีมที่เกี่ยวข้อง	ในการศึกษาเชิงคุณภาพ (Qualitative research) การ Coding คือกระบวนการจัดระเบียบข้อมูลดิบ (เช่น บทสัมภาษณ์) โดยการให้รหัสหรือคำสำคัญเพื่อจัดกลุ่มข้อมูลที่มีเนื้อหาคล้ายกันเข้าด้วยกัน เพื่อนำไปสู่การวิเคราะห์ธีม (Theme) หรือแก่นความรู้ต่อไป ไม่ใช่การแปลงเป็นตัวเลขทางสถิติ	["COMMED_52FMT"]
COMMED_52FMT_28	28. การศึกษาต้องการเปรียบเทียบ ค่าเฉลี่ยระดับน้ำตาลในเลือด ระหว่างผู้ป่วยที่ได้รับยาชนิดใหม่กับผู้ที่ได้รับยามาตรฐาน โดยกำหนดให้จำนวนตัวอย่างในสองกลุ่มเท่ากัน สูตรการคำนวณขนาดตัวอย่างที่เหมาะสมที่สุดคือข้อใด?		Two-sample comparison of proportions///One-sample comparison of proportion to hypothesized value///Finite population proportion///One-sample comparison of mean to hypothesized value///Two-sample comparison of means	Two-sample comparison of means	โจทย์ต้องการเปรียบเทียบ 'ค่าเฉลี่ย' (Mean) ของระดับน้ำตาล ระหว่าง 'สองกลุ่ม' (ยาใหม่ vs ยามาตรฐาน) ดังนั้นสูตรที่ถูกต้องคือการเปรียบเทียบค่าเฉลี่ยของสองกลุ่มอิสระต่อกัน (Two-sample comparison of means) ส่วนข้อ Proportion จะใช้กับข้อมูลที่เป็นร้อยละหรือสัดส่วน	["COMMED_52FMT"]
COMMED_52FMT_29	29. การศึกษาหนึ่งรายงานว่า Odds ratio = 2.0 (95% CI: 1.3 – 3.1) สำหรับความสัมพันธ์ระหว่างการสูบบุหรี่กับโรคปอด ข้อใดเป็นการตีความที่เหมาะสมที่สุด?		ค่า odds ratio ที่แท้จริงเท่ากับ 2.0 เสมอ///ผลลัพธ์ไม่มีนัยสำคัญทางสถิติ///การสูบบุหรี่สัมพันธ์กับความเสี่ยงโรคปอดที่เพิ่มขึ้นอย่างมีนัยสำคัญทางสถิติ///การสูบบุหรี่ลดความเสี่ยงโรคปอด///ไม่มีความสัมพันธ์ระหว่างการสูบบุหรี่กับโรคปอด	การสูบบุหรี่สัมพันธ์กับความเสี่ยงโรคปอดที่เพิ่มขึ้นอย่างมีนัยสำคัญทางสถิติ	ค่า Odds ratio (OR) = 2.0 หมายถึงโอกาสเกิดโรคในผู้สูบบุหรี่เป็น 2 เท่า และช่วงความเชื่อมั่น (95% CI) คือ 1.3 ถึง 3.1 ซึ่งค่าต่ำสุด (1.3) ยังคงมากกว่า 1.0 แสดงว่าความสัมพันธ์นี้มีนัยสำคัญทางสถิติ (Statistically significant) และเป็นการเพิ่มความเสี่ยง	["COMMED_52FMT"]
COMMED_52FMT_30	30. การศึกษาหนึ่งรายงานว่า Relative risk = 1.5 (95% CI: 0.95 – 2.4) ข้อใดเป็นการตีความที่เหมาะสมที่สุด?		มีความสัมพันธ์อย่างมีนัยสำคัญทางสถิติ///ค่า relative risk ในประชากรเท่ากับ 1.5 เสมอ///ไม่พบความสัมพันธ์อย่างมีนัยสำคัญทางสถิติ///การสูบบุหรี่ลดความเสี่ยงของโรค///ความสัมพันธ์มีนัยสำคัญทางคลินิกเสมอ	ไม่พบความสัมพันธ์อย่างมีนัยสำคัญทางสถิติ	แม้ค่า Relative risk (RR) จะเป็น 1.5 แต่ช่วงความเชื่อมั่น 95% CI (0.95 - 2.4) ครอบคลุมค่า 1.0 (Null value) ซึ่งหมายความว่าในทางสถิติ เราไม่สามารถสรุปได้ว่าความเสี่ยงเพิ่มขึ้นหรือลดลงจริง จึงถือว่า 'ไม่มีนัยสำคัญทางสถิติ'	["COMMED_52FMT"]
COMMED_52FMT_31	31. การศึกษาเปรียบเทียบค่าเฉลี่ย systolic blood pressure ระหว่างกลุ่มที่ได้รับโปรแกรมออกกำลังกายกับกลุ่มควบคุม รายงานผลดังนี้ Study A: mean difference = −5 mmHg (95% CI: −7 ถึง −3), Study B: mean difference = −5 mmHg (95% CI: −12 ถึง 2) ข้อใดต่อไปนี้เป็นการตีความที่ถูกต้องที่สุด?		Study B มี precision สูงกว่า Study A เนื่องจากช่วงความเชื่อมั่นกว้างกว่า///Study A มีความแม่นยำ (precision) สูงกว่า และมีนัยสำคัญทางสถิติ///Study B มีนัยสำคัญทางสถิติ แต่ Study A ไม่มี///ทั้งสองการศึกษามีผลลัพธ์ที่มีนัยสำคัญทางสถิติ เพราะค่า mean difference เท่ากัน///ทั้งสองการศึกษาไม่สามารถสรุปผลได้ เพราะค่า mean difference เท่ากัน	Study A มีความแม่นยำ (precision) สูงกว่า และมีนัยสำคัญทางสถิติ	Study A มีช่วงความเชื่อมั่นที่แคบกว่า (-7 ถึง -3) จึงมีความแม่นยำ (Precision) สูงกว่า และไม่ครอบคลุมค่า 0 จึงมีนัยสำคัญทางสถิติ ในขณะที่ Study B ช่วงความเชื่อมั่นกว้างมากและครอบคลุม 0 (-12 ถึง 2) จึงไม่มีนัยสำคัญทางสถิติ	["COMMED_52FMT"]
COMMED_52FMT_32	32. การสุ่มกลุ่มตัวอย่างจากประชากรที่มีคุณภาพในการวิจัย มีข้อดีอย่างไร?		เพิ่ม output///เพิ่ม Internal Validity///เพิ่ม External Validity///เพิ่ม effectiveness///เพิ่ม Reliability	เพิ่ม External Validity	การสุ่มกลุ่มตัวอย่าง (Random sampling) ช่วยให้กลุ่มตัวอย่างเป็นตัวแทนที่ดีของประชากร ซึ่งส่งผลโดยตรงต่อการเพิ่ม External Validity (ความตรงภายนอก) ทำให้สามารถอ้างอิงผลการวิจัยกลับไปยังประชากรกลุ่มใหญ่ได้ ส่วน Internal validity มักเน้นที่การ Random allocation (การสุ่มแบ่งกลุ่ม)	["COMMED_52FMT"]
COMMED_52FMT_33	33. การเฝ้าระวังทางระบาดวิทยาประเภทใดที่อาศัยการรวบรวมข้อมูลตามปกติจากผู้ให้บริการด้านสุขภาพ?		Passive surveillance///Disease surveillance///Active surveillance///Sentinel surveillance///Syndromic surveillance	Passive surveillance	Passive surveillance (การเฝ้าระวังเชิงรับ) คือระบบที่หน่วยงานส่วนกลางรอรับรายงานโรคที่มีการส่งมาจากสถานพยาบาลตามระเบียบปกติ โดยที่ผู้ให้บริการสุขภาพเป็นผู้กรอกข้อมูลส่งมาเอง ส่วน Active surveillance คือการที่เจ้าหน้าที่ลงไปหาข้อมูลเชิงรุกเอง	["COMMED_52FMT"]
COMMED_52FMT_34	34. ข้อมูลรายได้ต่อเดือนของผู้ป่วยในโรงพยาบาลแห่งหนึ่งมีลักษณะเบ้ขวาอย่างมาก (right-skewed) เนื่องจากมีผู้ป่วยบางรายที่มีรายได้สูงมากผิดปกติ นักวิจัยต้องการอธิบาย ค่ารายได้โดยทั่วไป (typical income) และ การกระจายของข้อมูลชุดนี้ สรุปข้อมูลโดยใช้สถิติแบบใดเหมาะสมที่สุด?		Mode และ percentile///Median และ variance///Mean และ standard deviation///Median และ interquartile range///Mean และ range	Median และ interquartile range	สำหรับข้อมูลที่มีลักษณะเบ้ (Skewed distribution) หรือมีค่าผิดปกติ (Outliers) ค่าเฉลี่ย (Mean) จะถูกดึงไปทางด้านที่เบ้ ทำให้ไม่ใช่ตัวแทนที่ดี จึงควรใช้ Median (มัธยฐาน) แทน และใช้ Interquartile range (IQR) เพื่อบอกการกระจาย เพราะทนทานต่อค่าที่สูงหรือต่ำผิดปกติได้ดีกว่า SD	["COMMED_52FMT"]
COMMED_52FMT_35	35. ข้อใดกล่าวถูกต้องเกี่ยวกับความสัมพันธ์ระหว่าง sensitivity และ specificity?		เมื่อเพิ่มค่า cut-off point ของการทดสอบ sensitivity จะเพิ่มขึ้นและ specificity จะลดลง///การทดสอบที่มี sensitivity 100% จะไม่มี false negative///การทดสอบที่มี sensitivity และ specificity สูงควรใช้เป็นการตรวจคัดกรองเสมอ///Sensitivity และ specificity เปลี่ยนแปลงตามความชุกของโรค (prevalence)///Sensitivity ที่สูงจะส่งผลให้มีค่า positive predictive value สูงเสมอ	การทดสอบที่มี sensitivity 100% จะไม่มี false negative	Sensitivity คือความสามารถในการตรวจพบโรคในคนที่เป็นโรคจริง (TP / [TP+FN]). หาก Sensitivity = 100% แสดงว่าค่า FN (False Negative) ต้องเป็น 0 เสมอ ส่วนข้อ D ผิดเพราะ Sens/Spec เป็นคุณสมบัติเฉพาะของตัวตรวจ ไม่เปลี่ยนตาม Prevalence (ที่เปลี่ยนคือ PPV/NPV)	["COMMED_52FMT"]
COMMED_52FMT_36	36. ข้อใดต่อไปนี้กล่าวถึง sensitivity ได้ถูกต้องที่สุด		Sensitivity คือความสามารถในการวินิจฉัยแยกโรคออกจากภาวะอื่นๆ///Sensitivity ช่วยบอกโอกาสที่คนไม่เป็นโรคจะมีผลตรวจเป็นลบ///Sensitivity สูงมักจะมาพร้อมกับ specificity สูงเสมอ///Sensitivity คำนวณจากสัดส่วนของผู้ที่มีผลตรวจเป็นบวกในกลุ่มคนที่เป็นโรค///การเพิ่ม prevalence ของโรคจะทำให้ sensitivity ของการตรวจสูงขึ้น	Sensitivity คำนวณจากสัดส่วนของผู้ที่มีผลตรวจเป็นบวกในกลุ่มคนที่เป็นโรค	Sensitivity (ความไว) นิยามคืออัตราส่วนของผลบวกจริงในกลุ่มคนที่เป็นโรค (True Positives / All Diseased). ข้อ A และ B หมายถึง Specificity ส่วนข้อ E ผิดเพราะความไวเป็นค่าคงที่ของเครื่องมือตรวจ ไม่เกี่ยวกับความชุกของโรคในชุมชน	["COMMED_52FMT"]
COMMED_52FMT_37	37. ข้อใดต่อไปนี้ถูกต้องเกี่ยวกับ likelihood ratio (LR)?		การทดสอบที่มี likelihood ratio negative เท่ากับ 0.1 มีประสิทธิภาพในการช่วยลดความน่าจะเป็นของโรค (rule out) ได้ดีกว่าการทดสอบที่มี likelihood ratio negative เท่ากับ 0.5///Likelihood ratio negative ที่มีค่าใกล้ 1 แสดงว่าการทดสอบนั้นมีความแม่นยำสูงในการยืนยันโรค///Likelihood ratio positive ยิ่งมีค่าสูง แสดงว่าการทดสอบนั้นยิ่งมีความสามารถในการคัดกรองโรค (screening test)///การทดสอบที่มี likelihood ratio positive เท่ากับ 2 มีประสิทธิภาพในการยืนยันโรค (rule in) ได้ดีกว่าการทดสอบที่มี likelihood ratio positive เท่ากับ 5///Likelihood ratio ไม่ขึ้นกับความชุก (prevalence) ของโรค แต่ขึ้นกับ Odds ratio ของโรคในประชากร	การทดสอบที่มี likelihood ratio negative เท่ากับ 0.1 มีประสิทธิภาพในการช่วยลดความน่าจะเป็นของโรค (rule out) ได้ดีกว่าการทดสอบที่มี likelihood ratio negative เท่ากับ 0.5	Likelihood ratio negative (LR-) ยิ่งเข้าใกล้ 0 ยิ่งดีในการแยกโรคออก (Rule out). ดังนั้น 0.1 จึงดีกว่า 0.5. ในขณะที่ LR+ ยิ่งสูงยิ่งดีในการยืนยันโรค (Rule in). LR ไม่ขึ้นกับความชุก ซึ่งเป็นข้อดีเหนือกว่า PPV/NPV	["COMMED_52FMT"]
COMMED_52FMT_38	38. ข้อใดต่อไปนี้มีผลทำให้ค่า Negative Predictive Value (NPV) ของการทดสอบลดลง?		การทดสอบที่มี specificity ต่ำลง///การทดสอบในประชากรที่มีความชุกของโรคต่ำ///การปรับเพิ่มจุดตัด (cut-off point) ทำให้ specificity สูงขึ้น///การทดสอบที่มี sensitivity สูงขึ้น///การทดสอบในประชากรที่มีความชุกของโรคสูง	การทดสอบในประชากรที่มีความชุกของโรคสูง	NPV (โอกาสที่ผลลบจะเป็นลบจริง) จะแปรผกผันกับความชุก (Prevalence). เมื่อความชุกของโรคสูงขึ้น โอกาสที่จะมีคนป่วยหลุดรอดไปมีผลเป็นลบ (False Negative) จะเพิ่มขึ้น ทำให้ความมั่นใจในผลลบ (NPV) ลดลง ในทางกลับกัน PPV จะสูงขึ้นเมื่อความชุกสูงขึ้น	["COMMED_52FMT"]
COMMED_52FMT_39	39. ข้อใดต่อไปนี้เป็นต้นทุนชนิด Indirect cost?		Life Years Gained (LYG)///Disability Weights (DW)///Disability-Adjusted Life Year (DALY)///Quality-Adjusted Life Year (QALY)///Health Adjusted Life Expectancy (HALE	Disability-Adjusted Life Year (DALY)	ในทางเศรษฐศาสตร์สาธารณสุข Indirect cost มักสื่อถึงการสูญเสียผลิตภาพ (Productivity loss) เนื่องจากการเจ็บป่วย ซึ่ง DALY (Disability-Adjusted Life Year) ถูกนำมาใช้ประเมินภาระโรคที่สะท้อนถึงปีสุขภาวะที่สูญเสียไปทั้งจากการตายก่อนวัยอันควรและความพิการ อย่างไรก็ตาม หากพิจารณาตามนิยามต้นทุนที่จ่ายจริง DALY/QALY มักถูกมองว่าเป็นหน่วยของ Outcome มากกว่า แต่ในบริบทของโจทย์ข้อนี้ DALY เป็นตัววัดที่เกี่ยวข้องกับการประเมินความสูญเสียเชิงอ้อมได้ดีที่สุด	["COMMED_52FMT"]
COMMED_52FMT_40	40. ข้อใดต่อไปนี้เป็นผลได้ที่เหมาะสมมากที่สุดสำหรับการนำมาใช้ประเมินผลทางด้านเศรษฐศาสตร์สาธารณสุขในกรณีที่ต้องการเปรียบเทียบต้นทุนของยา 2 ชนิดกับผลลัพธ์ทางคลินิกว่ายาชนิดใดสามารถทำให้ผู้ป่วยมีช่วงเวลาที่มีสุขภาพสมบูรณ์ได้ยาวนานกว่า?		Year of Life Lost due to Disability (YLD)///Quality-Adjusted Life Year (QALY)///Cost Effectiveness Ratio (CER)///Cost-Outcome Description (COD)///Disability-Adjusted Life Year (DALY)	Quality-Adjusted Life Year (QALY)	QALY (Quality-Adjusted Life Year) เป็นตัวชี้วัดที่รวมเอาทั้ง 'ปริมาณชีวิต' (จำนวนปีที่รอดชีวิต) และ 'คุณภาพชีวิต' (สุขภาพที่สมบูรณ์) เข้าด้วยกัน เหมาะที่สุดสำหรับการศึกษาแบบ Cost-Utility Analysis เพื่อเปรียบเทียบความคุ้มค่าของยาในแง่การเพิ่มปีสุขภาวะ	["COMMED_52FMT"]
COMMED_52FMT_41	41. ข้อใดเป็นการศึกษาทางระบาดวิทยาที่เหมาะกับการทำงานด้านเวชศาสตร์ชุมชน?		ประสิทธิภาพของบุคลากรทางการแพทย์///ประสิทธิภาพของการรักษา///ประสิทธิภาพของการวิจัย///ประสิทธิภาพของนโยบายสาธารณสุข///ประสิทธิภาพของคัดกรองโรค	ประสิทธิภาพของนโยบายสาธารณสุข	เวชศาสตร์ชุมชน (Community Medicine) เน้นการดูแลสุขภาพในระดับประชากร การศึกษาทางระบาดวิทยาจึงถูกใช้เป็นเครื่องมือสำคัญในการประเมิน ประสิทธิภาพของนโยบายสาธารณสุข เพื่อวางแผนและจัดการทรัพยากรให้เหมาะสมกับปัญหาของชุมชนในภาพรวม	["COMMED_52FMT"]
COMMED_52FMT_42	42. ข้อใดเป็นข้อจำกัดของการวิจัยเชิงคุณภาพ?		สามารถนำไปใช้ประโยชน์ได้เฉพาะบริบทที่เหมือนหรือใกล้เคียงกับการศึกษา///ผลการศึกษามีตัวเลขที่ซับซ้อน///การใช้งบประมาณสูง///การเลือกกลุ่มตัวอย่างที่ไม่น่าเชื่อถือ///การใช้เวลานานในขั้นตอนของการเก็บข้อมูล	สามารถนำไปใช้ประโยชน์ได้เฉพาะบริบทที่เหมือนหรือใกล้เคียงกับการศึกษา	ข้อจำกัดหลักของการวิจัยเชิงคุณภาพ (Qualitative research) คือการขาด Generalizability หรือการไม่สามารถนำผลสรุปไปอ้างอิงกับประชากรทั่วไปได้ เนื่องจากเน้นศึกษาในบริบทเฉพาะ (Context-specific) เพื่อความเข้าใจในเชิงลึก ผลวิจัยจึงใช้ได้กับสถานการณ์ที่ใกล้เคียงกันเท่านั้น	["COMMED_52FMT"]
COMMED_52FMT_43	43. ข้อใดเป็นขั้นตอนสุดท้ายในการทำการศึกษาเชิงคุณภาพ?		การเขียนรายงานวิจัย///การเก็บรวบรวมข้อมูลเพิ่มเติม///การคืนข้อมูลกลับสู่ชุมชน///การวิเคราะห์ข้อมูล///การปรับวัตถุประสงค์	การคืนข้อมูลกลับสู่ชุมชน	ในการศึกษาเชิงคุณภาพ โดยเฉพาะในงานชุมชน การคืนข้อมูลสู่ชุมชน (Data homecoming/reflection) เป็นขั้นตอนสุดท้ายที่สำคัญ เพื่อตรวจสอบความถูกต้องของข้อมูล (Member checking) และเพื่อให้ชุมชนได้เรียนรู้และนำผลการศึกษาไปใช้ประโยชน์ต่อสอดคล้องกับจริยธรรมการวิจัย	["COMMED_52FMT"]
COMMED_52FMT_44	44. ข้อใดเป็นประโยชน์ของการเลือกกลุ่มตัวอย่างที่เหมาะสมในการศึกษาเชิงคุณภาพ?		เพื่อให้สามารถอ้างอิงการศึกษากับประชากรทั้งหมดได้///เพื่อให้สามารถใช้เครื่องมือวัดที่หลากหลาย///เพื่อให้สามารถใช้สถิติได้ง่ายขึ้น///เพื่อลดค่าใช้จ่ายในการวิเคราะห์ข้อมูล///เพื่อให้ข้อมูลมีความลึกและมีความหลากหลายเพียงพอ	เพื่อให้ข้อมูลมีความลึกและมีความหลากหลายเพียงพอ	การเลือกกลุ่มตัวอย่างในการวิจัยเชิงคุณภาพมักเป็นแบบเจาะจง (Purposive sampling) โดยมีวัตถุประสงค์หลักเพื่อให้ได้ข้อมูลที่ 'รุ่มรวย' (Rich data) มีความลึกและครอบคลุมทุกแง่มุมที่เกี่ยวข้องกับปรากฏการณ์ที่ต้องการศึกษา ไม่ได้เน้นการใช้สถิติหรือการอ้างอิงเชิงปริมาณ	["COMMED_52FMT"]
COMMED_52FMT_45	45. ข้อใดเป็นระบบเฝ้าระวังที่มุ่งเน้นการตรวจจับแนวโน้มของอาการที่เกี่ยวข้องกับโรคก่อนการวินิจฉัยโรคอย่างเป็นทางการ?		Genomic Surveillance///Syndromic Surveillance///Laboratory-based Surveillance///Passive Surveillance///Sentinel Surveillance	Syndromic Surveillance	Syndromic Surveillance (การเฝ้าระวังกลุ่มอาการ) คือการเฝ้าติดตามข้อมูลอาการ (เช่น การมีไข้สูงร่วมกับผื่น) หรือพฤติกรรม (เช่น การซื้อยาลดไข้ที่เพิ่มขึ้น) เพื่อใช้เป็นสัญญาณเตือนภัยล่วงหน้าของการระบาด ก่อนที่จะได้รับการยืนยันการวินิจฉัยจากห้องปฏิบัติการ	["COMMED_52FMT"]
COMMED_52FMT_46	46. ข้อใดไม่ใช่คุณสมบัติที่ดีของ Health Indicators?		สามารถเปรียบเทียบได้ (Comparable)///ความจำเพาะ (Specificity)///ความเที่ยงตรง (Validity)///สื่อความหมายได้ง่าย (Understandable)///ความเป็นอัตวิสัย (Subjectivity)	ความเป็นอัตวิสัย (Subjectivity)	ตัวชี้วัดสุขภาพที่ดีควรมีความเป็น 'ปรนัย' (Objectivity) เพื่อให้ผลการวัดคงที่และเชื่อถือได้ ไม่ขึ้นกับความรู้สึกส่วนตัวของผู้ประเมิน นอกจากนี้ต้องมีความเที่ยงตรง (Validity) ความจำเพาะ (Specificity) และสามารถเปรียบเทียบได้	["COMMED_52FMT"]
COMMED_52FMT_47	47. ข้อใดไม่ใช่แหล่งข้อมูลในการหาตัวชี้วัดทางภาวะสุขภาพ?		ระบบการบริการ (Routine health service records)///การสำรวจทัศนคติของประชาชนทั่วไปทางโซเชียลมีเดีย (Social media opinion polls)///ระบบเฝ้าระวังทางระบาดวิทยา (Epidemiological surveillance data)///ระบบสถิติชีพ (vital events registers)///การสำมะโนประชากร และสำมะโนหลังคาเรือน (Population Housing Census)	การสำรวจทัศนคติของประชาชนทั่วไปทางโซเชียลมีเดีย (Social media opinion polls)	แหล่งข้อมูลมาตรฐานสำหรับ Health Indicators คือระบบสถิติชีพ (ข้อ D), สำมะโนประชากร (ข้อ E), และระเบียนบริการสาธารณสุข (ข้อ A, C) ส่วน Social media opinion polls มักขาดความเป็นตัวแทนของประชากรและขาดความเที่ยงตรงทางระบาดวิทยาในการวัดภาวะสุขภาพจริง	["COMMED_52FMT"]
COMMED_52FMT_48	48. ข้อใดไม่ใช้ในการศึกษาเชิงคุณภาพ?		การวิเคราะห์เนื้อหา///การสัมภาษณ์เชิงลึก///การสังเกต///การสนทนากลุ่ม///การใช้แบบสอบถามชนิดตอบเอง	การใช้แบบสอบถามชนิดตอบเอง	แบบสอบถามชนิดตอบเอง (Self-administered questionnaire) มักเป็นเครื่องมือของการศึกษาเชิงปริมาณ (Quantitative research) เพื่อเก็บข้อมูลจากคนจำนวนมาก ส่วนข้อ A-D เป็นวิธีการหลักในการเก็บและวิเคราะห์ข้อมูลเชิงคุณภาพเพื่อเน้นความเข้าใจในเชิงลึก	["COMMED_52FMT"]
COMMED_52FMT_49	49. ขั้นตอนใดเป็นขั้นตอนแรกที่สำคัญที่สุดในการประเมินวิจารณ์บทความวิชาการทางการแพทย์?		การตรวจสอบสถิติที่ใช้ในการวิเคราะห์///การตรวจสอบชื่อเสียงของผู้วิจัย///การกำหนดคำถามวิจัยที่ชัดเจนและการพิจารณาว่าแบบแผนการวิจัยเหมาะสมหรือไม่///การตรวจสอบปีที่ตีพิมพ์บทความ///การตรวจสอบแหล่งเงินทุนสนับสนุนการวิจัย	การกำหนดคำถามวิจัยที่ชัดเจนและการพิจารณาว่าแบบแผนการวิจัยเหมาะสมหรือไม่	ในการประเมินบทความ (Critical Appraisal) ขั้นตอนแรกคือการตรวจสอบความสมเหตุสมผลของ 'คำถามวิจัย' และ 'รูปแบบการวิจัย' (Research design) ว่าสามารถตอบคำถามนั้นได้จริงหรือไม่ หากโครงสร้างงานวิจัยผิดพลาดตั้งแต่ต้น การวิเคราะห์สถิติที่ซับซ้อนก็ไม่สามารถทำให้ผลงานวิจัยนั้นน่าเชื่อถือได้	["COMMED_52FMT"]
COMMED_52FMT_50	50. คำว่า "epidemic curve" ใช้เพื่ออธิบาย:?		เป็นการแสดงการแพร่กระจายเชื้อ///การทำนายการระบาดของโรค///การกระจายทางภูมิศาสตร์ของโรคระบาด///จำนวนผู้ป่วยตามช่วงเวลาในช่วงการระบาด///การแสดงความสามารถของเชื้อโรค	จำนวนผู้ป่วยตามช่วงเวลาในช่วงการระบาด	Epidemic curve คือกราฟแท่งที่แสดงจำนวนผู้ป่วย (แกน Y) ตามเวลาที่เริ่มมีอาการ (แกน X) ในช่วงที่มีการระบาด ซึ่งช่วยให้นักระบาดวิทยาทราบถึงทิศทางการระบาด ระยะฟักตัวของโรค และแหล่งแพร่เชื้อ	["COMMED_52FMT"]
COMMED_52FMT_51	51. คำว่า Triangulation ในการศึกษาเชิงคุณภาพ ใช้เพื่อวัตถุประสงค์ใด?		เพื่อเพิ่มศักยภาพของนักวิจัย///เพื่อเพิ่มวิธีการวิเคราะห์ข้อมูล///เพื่อเพิ่มขนาดกลุ่มตัวอย่าง///เพื่อเพิ่มข้อสรุปในการวิจัย///เพื่อเพิ่มความน่าเชื่อถือและความถูกต้องของข้อมูล	เพื่อเพิ่มความน่าเชื่อถือและความถูกต้องของข้อมูล	Triangulation (การตรวจสอบสามเส้า) คือการใช้แหล่งข้อมูลหลายแห่ง นักวิจัยหลายคน หรือวิธีการรวบรวมข้อมูลหลายวิธีมาตรวจสอบความสอดคล้องกัน เพื่อเพิ่มความน่าเชื่อถือ (Trustworthiness/Validity) ของผลการศึกษาเชิงคุณภาพ	["COMMED_52FMT"]
COMMED_52FMT_52	52. งานวิจัยหนึ่งรายงานตัวแปรดังต่อไปนี้: Sex (ชาย/หญิง), Pain severity (ไม่มี, เล็กน้อย, ปานกลาง, รุนแรง), Temperature หน่วยองศาเซลเซียส (°C), Body weight หน่วยกิโลกรัม (kg). ข้อใดจับคู่ตัวแปรเหล่านี้กับ measurement scales ได้ถูกต้อง?		Sex = ordinal; pain severity = nominal; temperature = ratio; body weight = interval///Sex = ordinal; pain severity = interval; temperature = nominal; body weight = ratio///Sex = nominal; pain severity = ordinal; temperature = interval; body weight = ratio///Sex = nominal; pain severity = ratio; temperature = interval; body weight = ordinal///Sex = interval; pain severity = ordinal; temperature = ratio; body weight = nominal	Sex = nominal; pain severity = ordinal; temperature = interval; body weight = ratio	Sex เป็น Nominal (จัดกลุ่มแบบไม่มีลำดับ), Pain severity เป็น Ordinal (จัดกลุ่มแบบเรียงลำดับได้), Temperature (Celsius) เป็น Interval (มีช่วงเท่ากันแต่ 0 ไม่ใช่ค่าศูนย์ที่แท้จริง), และ Body weight เป็น Ratio (มีค่า 0 ที่แท้จริง) การเลือกมาตรวัดที่ถูกต้องสำคัญต่อการเลือกใช้สถิติในการวิเคราะห์ข้อมูล	["COMMED_52FMT"]
COMMED_52FMT_53	53. จากตารางแสดงผลการตรวจวินิจฉัยโรคหนึ่งเมื่อเทียบกับมาตรฐานการวินิจฉัย: โรคบวก (100 ราย), โรคลบ (400 ราย), ผลตรวจบวก (โรคบวก 92, โรคลบ 24), ผลตรวจลบ (โรคบวก 8, โรคลบ 376) Likelihood ratio negative (LR-) ของการตรวจนี้มีค่าเท่าใด?	https://drive.google.com/uc?export=view&id=1B8CRTPoLaeZccthesElv9gluDIUbStN4	0.02///0.24///0.09///0.11///3.83	0.09	การคำนวณ Likelihood ratio negative (LR-) ใช้สูตร (1 - Sensitivity) / Specificity จากตารางพบว่า Sensitivity = 92/100 = 0.92 และ Specificity = 376/400 = 0.94 ดังนั้น LR- = (1 - 0.92) / 0.94 = 0.08 / 0.94 ซึ่งคำนวณได้ประมาณ 0.085 หรือปัดเป็น 0.09 ส่วนข้อ A, B, D และ E เป็นค่าที่เกิดจากการคำนวณผิดตำแหน่ง เช่น 0.11 อาจเกิดจากการสลับเศษส่วน หรือ 3.83 เป็นค่า LR+ โดยประมาณ (0.92 / (1-0.94)) ซึ่งไม่ใช่สิ่งที่โจทย์ถาม	["COMMED_52FMT"]
COMMED_52FMT_54	54. จากรายงานภาระโรคและการบาดเจ็บของประชากรไทย พ.ศ. 2562 เมื่อพิจารณาการตายจำแนกตามรายโรคของประชากรไทยทุกอายุในปี พ.ศ. 2562 โรคหรือภาวะใดที่ทำให้เกิดการเสียชีวิตมากที่สุดทั้งในเพศหญิงและเพศชาย?		โรคหลอดเลือดสมอง///การบาดเจ็บทางถนน///โรคหัวใจขาดเลือด///โรคมะเร็งตับ///โรคเบาหวาน	โรคหลอดเลือดสมอง	จากข้อมูลระบาดวิทยาและรายงานภาระโรค (Burden of Disease) ของประเทศไทย พ.ศ. 2562 พบว่า Stroke หรือโรคหลอดเลือดสมอง เป็นสาเหตุการเสียชีวิตอันดับ 1 ของทั้งเพศชายและเพศหญิง ส่วนข้อ C โรคหัวใจขาดเลือดเป็นสาเหตุรองลงมา ข้อ D โรคมะเร็งตับพบบ่อยในเพศชายแต่ไม่ใช่สาเหตุการตายอันดับหนึ่งรวมทั้งสองเพศ ข้อ B การบาดเจ็บทางถนนเป็นสาเหตุหลักในกลุ่มวัยรุ่นและวัยทำงานชาย และข้อ E โรคเบาหวานเป็นสาเหตุการเสียชีวิตที่สำคัญแต่ยังน้อยกว่า Stroke	["COMMED_52FMT"]
COMMED_52FMT_55	55. ชายคนหนึ่งกำลังพิจารณาถึงข้อดีข้อเสียของการเลิกบุหรี่ และวางแผนที่จะเลิกภายใน 6 เดือนต่อจากนี้ ชายคนนี้อยู่ใน Stages of Change ขั้นตอนใด?		Action///Precontemplation///Maintenance///Preparation///Contemplation	Contemplation	ตามทฤษฎี Transtheoretical Model (Stages of Change) ระยะ Contemplation คือการที่บุคคลตระหนักถึงปัญหาและเริ่มคิดจะเปลี่ยนแปลงพฤติกรรมภายใน 6 เดือนข้างหน้าแต่ยังไม่ได้ลงมือทำ ส่วนข้อ B Precontemplation คือยังไม่คิดจะเลิกเลย ข้อ D Preparation คือตัดสินใจจะเลิกภายใน 1 เดือนและเริ่มเตรียมตัว ข้อ A Action คือลงมือเลิกมาแล้วไม่เกิน 6 เดือน และข้อ C Maintenance คือเลิกมาได้ต่อเนื่องเกิน 6 เดือนแล้ว	["COMMED_52FMT"]
COMMED_52FMT_56	56. ชายคนหนึ่งตั้งใจลดน้ำหนัก โดยการควบคุมอาหารและออกกำลังกายอย่างสม่ำเสมอ เขาเชื่อว่าสุขภาพจะดีได้ ขึ้นอยู่กับการกระทำของตนเอง ชายคนนี้มีแนวโน้มเป็น Locus of Control แบบใด?		External Locus of Control///Active Locus of Control///Passive Locus of Control///Internal Locus of Control///Avoidant Locus of Control	Internal Locus of Control	Internal Locus of Control คือความเชื่อที่ว่าเหตุการณ์หรือผลลัพธ์ในชีวิตเกิดจากการกระทำและความสามารถของตนเอง (Self-determination) ซึ่งตรงกับผู้ป่วยรายนี้ที่เชื่อว่าสุขภาพดีขึ้นอยู่กับการกระทำของเขา ส่วนข้อ A External Locus of Control คือเชื่อว่าสุขภาพขึ้นอยู่กับโชคชะตาหรือผู้อื่นสั่งการ ข้อ B, C และ E เป็นศัพท์ที่ไม่ได้ใช้เป็นมาตรฐานในทฤษฎี Locus of Control ของ Rotter ในบริบทนี้	["COMMED_52FMT"]
COMMED_52FMT_57	57. ชายคนหนึ่งเป็นคนที่มีความเครียดสูง มีความสัมพันธ์ที่ไม่ดีกับเพื่อนร่วมงาน ชายคนนี้มีแนวโน้มมีภาวะสุขภาพอย่างไร?		ลดความเสี่ยงต่อการเกิดโรคหัวใจและหลอดเลือด///ไม่มีผลต่อสุขภาพ///เพิ่มความเสี่ยงต่อการเกิดโรคนอนไม่หลับ///ลดความเสี่ยงต่อการเกิดโรคมะเร็ง///ทำให้ภูมิคุ้มกันดีขึ้น	เพิ่มความเสี่ยงต่อการเกิดโรคนอนไม่หลับ	ความเครียดเรื้อรัง (Chronic stress) และความสัมพันธ์ทางสังคมที่ไม่ดีส่งผลลบต่อระบบประสาทอัตโนมัติและระดับฮอร์โมน cortisol ซึ่งนำไปสู่โรคนอนไม่หลับ (Insomnia) และเพิ่มความเสี่ยงต่อกลุ่มโรค NCDs ส่วนข้อ A, D และ E ผิดเนื่องจากความเครียดส่งผลตรงกันข้าม คือเพิ่มความเสี่ยงโรคหัวใจ เพิ่มความเสี่ยงมะเร็งบางชนิด และทำให้ภูมิคุ้มกันแย่ลง (Immunosuppression) ส่วนข้อ B ผิดเพราะปัจจัยทางจิตสังคม (Psychosocial factors) มีผลต่อสุขภาพอย่างมีนัยสำคัญ	["COMMED_52FMT"]
COMMED_52FMT_58	58. ชุมชนที่ขาดแคลนสถานพยาบาลและบริการด้านสุขภาพที่เหมาะสม คนในชุมชนจะมีแนวโน้มด้านสุขภาพอย่างไร?		ไม่มีผลต่อสุขภาพ///ลดความเสี่ยงต่อการเกิดโรคเรื้อรัง เช่น โรคอ้วน โรคเบาหวาน///ลดโอกาสในการเข้าถึงการรักษาพยาบาลที่จำเป็น///มีสุขภาพใจดีขึ้น///มีสุขภาพกายแข็งแรงมากขึ้น	ลดโอกาสในการเข้าถึงการรักษาพยาบาลที่จำเป็น	การขาดแคลนโครงสร้างพื้นฐานด้านสาธารณสุขเป็นปัจจัยกำหนดสุขภาพ (Social Determinants of Health) ที่ส่งผลโดยตรงต่อ Barrier to care ทำให้คนในชุมชนไม่สามารถเข้าถึงการตรวจคัดกรองหรือรักษาที่ทันเวลา ส่วนข้อ B, D และ E ผิดเพราะการขาดบริการสุขภาพย่อมเพิ่มความเสี่ยงต่อโรคเรื้อรังและส่งผลเสียต่อทั้งสุขภาพกายและใจ ส่วนข้อ A ผิดเนื่องจากสภาพแวดล้อมและระบบบริการมีผลกระทบต่อสุขภาพโดยตรง	["COMMED_52FMT"]
COMMED_52FMT_59	59. นักวิจัยต้องการประมาณ ความชุกของโรคพยาธิใบไม้ตับในผู้ใหญ่ในชุมชนหนึ่ง ซึ่งมีประชากรศึกษา 3,000 คน โดยกำหนดระดับนัยสำคัญ (α) = 0.05 และค่าความคลาดเคลื่อนที่ยอมรับได้ 5% จากการทบทวนวรรณกรรม งานวิจัยที่ผ่านมามีค่าความชุกของโรคนี้ 10% จากสถานการณ์นี้ ควรใช้สูตรใดในการคำนวณขนาดตัวอย่าง?		Infinite population mean///Finite population proportion///Two-sample comparison of proportions///Infinite population proportion///Finite population mean	Finite population proportion	โจทย์ต้องการหา 'ความชุก' (Prevalence) ซึ่งเป็นข้อมูลสัดส่วน (Proportion) และมีการระบุจำนวนประชากรที่ชัดเจนคือ 3,000 คน (Finite population) ดังนั้นจึงต้องใช้สูตร Finite population proportion (เช่น สูตรของ Taro Yamane หรือ Cochran's formula with finite correction) ส่วนข้อ A และ E ใช้สำหรับค่าเฉลี่ย ข้อ D ใช้เมื่อไม่ทราบจำนวนประชากรที่แน่นอน และข้อ C ใช้สำหรับการเปรียบเทียบสัดส่วนระหว่าง 2 กลุ่ม	["COMMED_52FMT"]
COMMED_52FMT_60	60. นักวิจัยต้องการศึกษา ความชุกของภาวะโรคอ้วนในบุคลากรมหาวิทยาลัยในปี พ.ศ. 2568 โดยเก็บข้อมูลน้ำหนักและส่วนสูงของบุคลากรทุกคนในช่วงเวลาเดียวกัน รูปแบบการศึกษาที่เหมาะสมที่สุดคือข้อใด?		Cross-sectional study///Cohort study///Case-control study///Randomized controlled trial///Descriptive study	Cross-sectional study	การศึกษาความชุก (Prevalence) ณ จุดเวลาใดเวลาหนึ่ง (Point in time) โดยการเก็บข้อมูลพร้อมกันในครั้งเดียวเรียกว่า Cross-sectional study หรือการศึกษาภาคตัดขวาง ส่วนข้อ B Cohort study ต้องมีการติดตามไปข้างหน้าเพื่อดูการเกิดโรคใหม่ (Incidence) ข้อ C Case-control study เริ่มจากคนที่เป็นโรคแล้วย้อนไปดูปัจจัยเสี่ยง และข้อ D RCT เป็นการวิจัยเชิงทดลองเพื่อดูประสิทธิภาพของ Intervention ซึ่งไม่ตรงกับวัตถุประสงค์ของโจทย์	["COMMED_52FMT"]
COMMED_52FMT_61	61. นักวิจัยต้องการศึกษาความแตกต่างระหว่างค่าระดับความดันโลหิตตัวบน ในผู้ใหญ่ ก่อนและหลังเข้าโปรแกรมออกกำลังกาย โดยค่าความต่างนี้มีการกระจายแบบปกติ ควรใช้สถิติใด?		ANOVA///Paired t-test///Pearson correlation///Independent t-test///Chi-square test	Paired t-test	เมื่อต้องการเปรียบเทียบค่าเฉลี่ยของข้อมูลต่อเนื่อง (Continuous data) จากกลุ่มตัวอย่างกลุ่มเดิมที่วัด 2 ครั้ง (ก่อนและหลัง) และข้อมูลมีการแจกแจงปกติ สถิติที่เหมาะสมที่สุดคือ Paired t-test ส่วนข้อ D Independent t-test ใช้เปรียบเทียบ 2 กลุ่มที่เป็นอิสระต่อกัน ข้อ A ANOVA ใช้เปรียบเทียบมากกว่า 2 กลุ่ม ข้อ C Pearson correlation ใช้หาความสัมพันธ์ของตัวแปร และข้อ E Chi-square ใช้สำหรับข้อมูลกลุ่ม (Categorical data)	["COMMED_52FMT"]

COMMED_52FMT_63	63. นักวิจัยต้องการศึกษาปัจจัยเสี่ยงของโรคเบาหวานในประชาชนไทย โดยสุ่มตัวอย่างแบบอาศัยความน่าจะเป็น มีการตั้งเกณฑ์การคัดเข้า คัดออกกลุ่มตัวอย่างอย่างอย่างเหมาะสม ประชากรที่นักวิจัยต้องการนำผลการศึกษาไปอ้างอิงถึง เรียกว่าอะไร?		General population///Sample population///Target population///Samples///Study population	Target population	Target population (ประชากรเป้าหมาย) คือกลุ่มประชากรทั้งหมดที่ผู้วิจัยต้องการสรุปผลการวิจัย (Generalization) ไปถึง เช่น ประชาชนไทยทุกคน ส่วนข้อ E Study population คือประชากรส่วนหนึ่งที่ผู้วิจัยสามารถเข้าถึงได้และใช้สุ่มตัวอย่าง ข้อ D Samples คือกลุ่มคนที่ถูกเลือกมาเข้างานวิจัยจริงๆ และข้อ B Sample population เป็นคำที่สื่อความหมายเดียวกับ Sample แต่ Target population คือคำศัพท์เฉพาะทางที่หมายถึงระดับของการอ้างอิงผล	["COMMED_52FMT"]
COMMED_52FMT_64	64. นักวิจัยต้องการศึกษาพฤติกรรมการสูบบุหรี่ไฟฟ้าของนักเรียนมัธยมศึกษา โดยสุ่มเลือกนักเรียนทุกๆช่วง 5 คน จากลิสต์รายชื่อของนักเรียนทั้งหมดในโรงเรียน วิธีการสุ่มนี้เรียกว่าอะไร?		Simple random sampling///Stratified sampling///Systematic sampling///Convenience sampling///Cluster sampling	Systematic sampling	การสุ่มตัวอย่างที่มีการกำหนดช่วง (Interval) ที่แน่นอน เช่น ทุกๆ k รายชื่อ (ในที่นี้คือ 5) เรียกว่า Systematic sampling หรือการสุ่มอย่างมีระบบ ส่วนข้อ A Simple random sampling คือการสุ่มแบบจับฉลากหรือใช้ตารางเลขสุ่มโดยไม่มีช่วง ข้อ B Stratified sampling คือการแบ่งชั้นภูมิก่อนสุ่ม ข้อ E Cluster sampling คือการสุ่มแบบยกกลุ่มหรือยกห้องเรียน และข้อ D Convenience sampling เป็นการสุ่มตามความสะดวก	["COMMED_52FMT"]
COMMED_52FMT_65	65. นักวิจัยต้องการศึกษาว่า การสูบบุหรี่สัมพันธ์กับการเกิดโรคปอดอุดกั้นเรื้อรัง (COPD) หรือไม่ โดยเริ่มต้นจากผู้ป่วยที่เป็น COPD และกลุ่มที่ไม่เป็น COPD แล้วสอบถามประวัติการสูบบุหรี่ในอดีต รูปแบบการศึกษาที่เหมาะสมที่สุดคือข้อใด?		Randomized controlled trial///Cross-sectional study///Case-control study///Descriptive study///Cohort study	Case-control study	รูปแบบการศึกษาที่เริ่มต้นจากการจำแนกกลุ่มตามสถานะการเป็นโรค (Case = เป็นโรค, Control = ไม่เป็นโรค) แล้วทำการสืบค้นย้อนกลับไปในอดีต (Retrospective) เพื่อดูประวัติการได้รับปัจจัยเสี่ยง เรียกว่า Case-control study ส่วนข้อ E Cohort study เริ่มจากผู้ที่ยังไม่เป็นโรคแต่ได้รับปัจจัยต่างกันแล้วติดตามไปในอนาคต ข้อ B Cross-sectional study วัดปัจจัยและโรคพร้อมกัน และข้อ A RCT เป็นงานวิจัยเชิงทดลอง	["COMMED_52FMT"]
COMMED_52FMT_66	66. นักวิจัยต้องการศึกษาว่า การออกกำลังกายเป็นประจำช่วยลดความเสี่ยงของการเกิดโรคเบาหวานในอนาคตหรือไม่ โดยติดตามกลุ่มคนที่ออกกำลังกายและไม่ออกกำลังกายเป็นเวลา 10 ปี รูปแบบการศึกษานี้คือข้อใด?		Randomized controlled trial///Descriptive study///Cross-sectional study///Case-control study///Cohort study	Cohort study	การศึกษาที่เริ่มต้นจากประชากรที่ยังไม่เป็นโรค แล้วแบ่งกลุ่มตามปัจจัยเสี่ยง (ออกกำลังกาย vs ไม่ออกกำลังกาย) จากนั้นติดตามไปในอนาคต (Prospective) เพื่อดูการเกิดอุบัติการณ์ของโรค (Incidence) คือ Cohort study ส่วนข้อ D Case-control เริ่มจากคนเป็นโรคแล้วย้อนอดีต ข้อ C Cross-sectional เป็นการสำรวจ ณ จุดเวลาเดียว และข้อ A RCT ต้องมีการสุ่มอาสาสมัครมาแบ่งกลุ่มเพื่อรับ Intervention โดยผู้วิจัย	["COMMED_52FMT"]
COMMED_52FMT_67	67. นักวิจัยต้องการเปรียบเทียบ ค่าเฉลี่ยระดับคอเลสเตอรอล ระหว่างผู้ป่วย 3 กลุ่ม ได้แก่ กลุ่มที่ได้ยาใหม่ กลุ่มที่ได้ยาเดิม และกลุ่มที่ได้รับยาหลอก ข้อมูลมีการกระจายแบบปกติ ควรใช้สถิติใดในการวิเคราะห์?		Chi-square test///ANOVA///Paired t-test///Independent t-test///Pearson correlation	ANOVA	เมื่อต้องการเปรียบเทียบค่าเฉลี่ยของข้อมูลต่อเนื่องจากกลุ่มตัวอย่างมากกว่า 2 กลุ่มขึ้นไป (ในที่นี้มี 3 กลุ่ม) และข้อมูลมีการแจกแจงปกติ สถิติที่เหมาะสมคือ One-way ANOVA ส่วนข้อ D Independent t-test ใช้เปรียบเทียบเพียง 2 กลุ่ม ข้อ C Paired t-test ใช้สำหรับกลุ่มเดียววัดซ้ำ ข้อ A Chi-square ใช้สำหรับข้อมูลเชิงกลุ่ม และข้อ E Pearson correlation ใช้หาความสัมพันธ์ไม่ใช่การเปรียบเทียบค่าเฉลี่ย	["COMMED_52FMT"]
COMMED_52FMT_68	68. นักวิจัยต้องการเปรียบเทียบการเกิดโรคมะเร็งปอดระหว่างผู้ที่สูบบุหรี่และผู้ที่ไม่สูบบุหรี่ ควรใช้สถิติใด?		Pearson correlation///Independent t-test///ANOVA///Paired t-test///Chi-square test	Chi-square test	ตัวแปรทั้งสองในการศึกษานี้คือ การเกิดโรคมะเร็งปอด (เป็น/ไม่เป็น) และ การสูบบุหรี่ (สูบ/ไม่สูบ) ซึ่งทั้งคู่เป็นข้อมูลเชิงกลุ่ม (Categorical data/Nominal) การหาความสัมพันธ์หรือเปรียบเทียบสัดส่วนระหว่างตัวแปรลักษณะนี้ต้องใช้ Chi-square test ส่วนข้อ B และ C ใช้สำหรับเปรียบเทียบค่าเฉลี่ยของข้อมูลเชิงปริมาณ และข้อ A Pearson correlation ใช้สำหรับข้อมูลเชิงปริมาณทั้งคู่	["COMMED_52FMT"]
COMMED_52FMT_69	69. นักวิจัยศึกษาว่า ระยะเวลาใช้หน้าจอเฉลี่ยต่อวัน ส่งผลต่อ คุณภาพการนอนหลับของนักศึกษามหาวิทยาลัยหรือไม่ โดยเก็บข้อมูล ระยะเวลาใช้หน้าจอ (ชั่วโมง/วัน), คะแนนคุณภาพการนอนหลับ, อายุ, เพศ และ การบริโภคคาเฟอีน ข้อใดระบุประเภทของตัวแปรในการศึกษานี้ได้ถูกต้องที่สุด?		ระยะเวลาใช้หน้าจอ = dependent variable; คะแนนคุณภาพการนอนหลับ = control variable; อายุ/เพศ/การบริโภคคาเฟอีน = independent variables///ระยะเวลาใช้หน้าจอ = dependent variable; คะแนนคุณภาพการนอนหลับ = independent variable; อายุ/เพศ/การบริโภคคาเฟอีน = control variables///ระยะเวลาใช้หน้าจอ = independent variable; คะแนนคุณภาพการนอนหลับ = dependent variable; อายุ/เพศ/การบริโภคคาเฟอีน = control variables///ระยะเวลาใช้หน้าจอ = control variable; คะแนนคุณภาพการนอนหลับ = dependent variable; อายุ/เพศ/การบริโภคคาเฟอีน = independent variables///ระยะเวลาใช้หน้าจอ = independent variable; คะแนนคุณภาพการนอนหลับ = control variable; อายุ/เพศ/การบริโภคคาเฟอีน = dependent variables	ระยะเวลาใช้หน้าจอ = independent variable; คะแนนคุณภาพการนอนหลับ = dependent variable; อายุ/เพศ/การบริโภคคาเฟอีน = control variables	ในการวิจัยนี้ ระยะเวลาใช้หน้าจอคือปัจจัยที่ส่งผล (Independent variable/ตัวแปรต้น) คะแนนคุณภาพการนอนหลับคือผลลัพธ์ที่วัด (Dependent variable/ตัวแปรตาม) และตัวแปรอื่นๆ เช่น อายุ เพศ คาเฟอีน คือตัวแปรที่ผู้วิจัยต้องควบคุมหรือนำมาพิจารณาร่วมเพื่อไม่ให้รบกวนผลการศึกษา (Control/Confounding variables) ส่วนข้อ A, B, D และ E มีการสลับตำแหน่งระหว่างตัวแปรต้นและตัวแปรตาม ซึ่งไม่ตรงตามสมมติฐานการวิจัย	["COMMED_52FMT"]
COMMED_52FMT_70	70. นักวิจัยเก็บข้อมูล ความพึงพอใจของนักศึกษาต่อการเรียนออนไลน์ โดยใช้หมวดหมู่ very dissatisfied ถึง very satisfied ข้อใดต่อไปนี้เป็นวิธีที่เหมาะสมที่สุดในการอธิบายและนำเสนอตัวแปรนี้?		รายงาน mean และ range และนำเสนอด้วย line graph///รายงาน variance และ interquartile range และนำเสนอด้วย scatterplot///รายงาน median และ percentages และนำเสนอด้วย bar chart///รายงาน mean และ standard deviation และนำเสนอด้วย histogram///รายงานเฉพาะ standard deviation และนำเสนอด้วย pie chart แยกเป็นรายนักศึกษาแต่ละคน	รายงาน median และ percentages และนำเสนอด้วย bar chart	ระดับความพึงพอใจ (Likert scale) เป็นข้อมูลประเภท Ordinal scale ซึ่งไม่ควรใช้ Mean และ SD เพราะระยะห่างระหว่างระดับไม่เท่ากัน สถิติพรรณนาที่เหมาะสมคือ Median (ค่ากลาง) และ Percentage (ร้อยละ) การนำเสนอควรใช้ Bar chart ส่วนข้อ D ผิดเพราะ Histogram ใช้สำหรับข้อมูลต่อเนื่อง (Ratio/Interval) ข้อ A Line graph ใช้แสดงแนวโน้มตามเวลา และข้อ B Scatterplot ใช้แสดงความสัมพันธ์ระหว่าง 2 ตัวแปรเชิงปริมาณ	["COMMED_52FMT"]
COMMED_52FMT_71	71. นักวิจัยในโรงพยาบาลใช้ข้อมูลที่มีอยู่แล้วใน electronic medical record (EMR) เพื่อวิเคราะห์ อายุของผู้ป่วย, BMI, การวินิจฉัยโรค และ ประวัติโรคเรื้อรัง ข้อใดกล่าวถูกต้องที่สุด?		ข้อมูลเหล่านี้เป็น primary data เพราะนักวิจัยเป็นผู้วิเคราะห์ข้อมูลโดยตรง///ข้อมูลเหล่านี้เป็น tertiary data เพราะข้อมูลผ่าน 3 ขั้นตอนก่อนนำไปใช้ ได้แก่ การเก็บในฐานข้อมูล การดึงข้อมูลโดยนักวิจัย และการวิเคราะห์///ตัวแปร ประวัติโรคเรื้อรัง มีมาตรวัดแบบ interval scale สำหรับการศึกษานี้ เพราะหมวดหมู่ของข้อมูลมีการเรียงลำดับ///ตัวแปร การวินิจฉัยโรค มีมาตรวัดแบบ ratio scale สำหรับการศึกษานี้ เพราะสามารถนับเป็นจำนวนที่ไม่ต่อเนื่อง (discrete numbers) ได้///ข้อมูลเหล่านี้เป็น secondary data เพราะข้อมูลถูกเก็บรวบรวมไว้ก่อนหน้านี้เพื่อวัตถุประสงค์อื่น	ข้อมูลเหล่านี้เป็น secondary data เพราะข้อมูลถูกเก็บรวบรวมไว้ก่อนหน้านี้เพื่อวัตถุประสงค์อื่น	ข้อมูลจาก EMR คือ Secondary data เพราะถูกเก็บรวบรวมไว้เพื่อการรักษาพยาบาล ไม่ใช่เพื่อการวิจัยนี้โดยเฉพาะตั้งแต่ต้น ส่วนข้อ A ผิดเพราะ Primary data คือข้อมูลที่ผู้วิจัยเก็บเองจากกลุ่มตัวอย่างใหม่ ข้อ B ไม่มีคำนิยาม Tertiary data ในบริบทแหล่งข้อมูลพื้นฐานแบบนี้ ข้อ C ประวัติโรคเรื้อรัง (มี/ไม่มี) เป็น Nominal และข้อ D การวินิจฉัยโรค (ชื่อโรค) เป็น Nominal ไม่ใช่ Ratio scale	["COMMED_52FMT"]
COMMED_52FMT_72	72. นักเรียนสองห้องมี ค่าเฉลี่ยคะแนนสอบ (mean examination score) เท่ากัน แต่ ห้อง A มีค่าส่วนเบี่ยงเบนมาตรฐาน (standard deviation) ของคะแนนมากกว่าห้อง B มาก ข้อใดตีความได้ถูกต้องที่สุด?		ห้อง B มีความแปรปรวนของคะแนนมากกว่าห้อง A///คะแนนของห้อง A มีการกระจายห่างจากค่าเฉลี่ยมากกว่า///ห้อง A มีคะแนนต่ำกว่าห้อง B โดยเฉลี่ย///ห้อง A มีการแจกแจงแบบเบ้ (skewed distribution) ส่วนห้อง B เป็นการแจกแจงแบบปกติ (normal distribution)///ทั้งสองห้องมีพิสัย (range) เท่ากัน	คะแนนของห้อง A มีการกระจายห่างจากค่าเฉลี่ยมากกว่า	Standard Deviation (SD) คือค่าที่บอกถึงการกระจายตัวของข้อมูลรอบค่าเฉลี่ย หาก SD มาก แสดงว่าข้อมูลมีความแตกต่างกันมากหรือกระจายตัวห่างจากค่าเฉลี่ย (Heterogeneous) ส่วนข้อ A ผิดเพราะ SD มากความแปรปรวนต้องมากกว่า ข้อ C ผิดเพราะค่าเฉลี่ยเท่ากัน ข้อ D ค่า SD ไม่ได้ระบุถึงความเบ้ของข้อมูล และข้อ E ค่า SD ต่างกันมักส่งผลให้ Range ต่างกันด้วยแม้จะไม่เสมอไปแต่ SD ไม่ใช่การวัด Range	["COMMED_52FMT"]
COMMED_52FMT_73	73. ผู้ป่วยเบาหวานรายหนึ่งทราบว่าการออกกำลังกายมีประโยชน์ต่อการควบคุมระดับน้ำตาล แต่ผู้ป่วยรายนี้ก็ไม่เคยออกกำลังกาย โดยให้เหตุผลว่า 'ไม่มีเวลา' ผู้ป่วยนี้เป็นไปตามทฤษฎี HEALTH BELIEF MODEL ในข้อใด?		Perceived Barriers///Perceived Severity///Perceived Benefits///Cues to Action///Self-Efficacy	Perceived Barriers	ตาม Health Belief Model (HBM) การที่ผู้ป่วยยกเหตุผลเรื่อง 'ไม่มีเวลา' เพื่ออธิบายว่าทำไมถึงไม่สามารถทำพฤติกรรมสุขภาพได้ จัดเป็น Perceived Barriers (การรับรู้อุปสรรค) ส่วนข้อ C Perceived Benefits คือการที่เขารู้ว่าการออกกำลังกายมีประโยชน์ ข้อ B Severity คือความรุนแรงของโรค และข้อ E Self-efficacy คือความมั่นใจในความสามารถที่จะทำพฤติกรรมนั้นได้	["COMMED_52FMT"]
COMMED_52FMT_74	74. ผู้ป่วยเบาหวานรายหนึ่งเริ่มออกกำลังกายอย่างสม่ำเสมอมา 4 เดือน ผู้ป่วยรายนี้อยู่ใน Stages of Change ขั้นตอนใด?		Precontemplation///Preparation///Contemplation///Maintenance///Action	Action	ในทฤษฎี Stages of Change ระยะ Action คือช่วงเวลาที่บุคคลได้เริ่มเปลี่ยนแปลงพฤติกรรมอย่างจริงจังแต่ยังทำต่อเนื่องไม่เกิน 6 เดือน ผู้ป่วยรายนี้ทำมา 4 เดือนจึงจัดอยู่ในระยะนี้ ส่วนข้อ D Maintenance ต้องทำต่อเนื่องเกิน 6 เดือนขึ้นไป ข้อ B Preparation คือเตรียมจะทำใน 1 เดือน และข้อ A, C คือระยะที่ยังไม่ได้เริ่มลงมือปฏิบัติ	["COMMED_52FMT"]
COMMED_52FMT_75	75. ผู้วิจัยกำลังทำการทดลองยาชนิดใหม่ในผู้ป่วยโรคหอบหืด โดยก่อนเริ่มโครงการได้มีการทบทวนข้อมูลจากการศึกษาก่อนหน้าอย่างละเอียด และออกแบบการศึกษาที่มีการติดตามอาการไม่พึงประสงค์อย่างใกล้ชิด รวมถึงมีเกณฑ์หยุดยาเมื่อพบอันตรายต่อผู้ป่วย หลักจริยธรรมการวิจัยในมนุษย์ข้อใดที่สะท้อนจากสถานการณ์นี้มากที่สุด?		Respect for persons///Beneficence / Non-maleficence///Respect for confidentiality///Respect for autonomy///Justice	Beneficence / Non-maleficence	หลักการพิจารณาประโยชน์ (Beneficence) และการไม่ก่ออันตราย (Non-maleficence) เกี่ยวข้องกับการลดความเสี่ยงและเพิ่มประโยชน์สูงสุดแก่ผู้เข้าร่วมวิจัย การเตรียมเกณฑ์การหยุดยา (Stopping rules) และการติดตามผลข้างเคียงอย่างใกล้ชิดสะท้อนถึงหลักการนี้โดยตรง ส่วนข้อ A และ D เกี่ยวกับการเคารพการตัดสินใจและให้ข้อมูลอิสระ และข้อ E Justice เกี่ยวกับการคัดเลือกกลุ่มตัวอย่างที่ยุติธรรม	["COMMED_52FMT"]
COMMED_52FMT_76	76. ผู้วิจัยกำลังทำการทดลองยาใหม่ในผู้ป่วยโรคความดันโลหิตสูง โดยก่อนเข้าร่วมโครงการ ผู้ป่วยได้รับการอธิบายรายละเอียดของงานวิจัย ความเสี่ยง และสิทธิในการถอนตัวได้ทุกเวลา หลักจริยธรรมการวิจัยใดที่เกี่ยวข้องมากที่สุด?		Confidentiality///Respect for persons///Justice///Scientific integrity///Beneficence	Respect for persons	หลัก Respect for persons (การเคารพในบุคคล) รวมถึงการให้ความสำคัญกับ Autonomy ผ่านกระบวนการ Informed consent ซึ่งต้องระบุความเสี่ยงและสิทธิในการถอนตัวอย่างชัดเจน ส่วนข้อ E Beneficence เน้นที่สมดุลความเสี่ยงและผลประโยชน์ ข้อ C Justice เน้นที่ความเท่าเทียมในการได้รับโอกาสหรือผลกระทบจากการวิจัย และข้อ A Confidentiality คือการรักษาความลับข้อมูลส่วนบุคคล	["COMMED_52FMT"]
COMMED_52FMT_77	77. ผู้สูงอายุรายหนึ่งรับรู้ว่าการฉีดวัคซีนป้องกันไข้หวัดใหญ่จะช่วยลดโอกาสในการป่วยเป็นไข้หวัดใหญ่ที่มีภาวะแทรกซ้อนได้ ผู้ป่วยนี้เป็นไปตามทฤษฎี HEALTH BELIEF MODEL ในข้อใด?		Self-Efficacy///Perceived Benefits///Perceived Susceptibility///Perceived Severity///Perceived Barriers	Perceived Benefits	Perceived Benefits (การรับรู้ประโยชน์) คือความเชื่อว่าการปฏิบัติพฤติกรรมสุขภาพอย่างใดอย่างหนึ่งจะช่วยลดความเสี่ยงหรือความรุนแรงของโรคได้ ซึ่งตรงกับกรณีที่ผู้ป่วยเชื่อว่าวัคซีนช่วยลดโอกาสป่วยและภาวะแทรกซ้อน ส่วนข้อ C Susceptibility คือเชื่อว่าตนเองเสี่ยงจะติดเชื้อ และข้อ D Severity คือเชื่อว่าถ้าเป็นแล้วจะอันตรายมาก ซึ่งโจทย์ไม่ได้เน้นในส่วนนั้น	["COMMED_52FMT"]

COMMED_52FMT_90	90. องค์ประกอบใดในวารสารทางการแพทย์ที่ช่วยให้ผู้อ่านเข้าใจถึงข้อจำกัดและข้อเสนอสำหรับการวิจัยในอนาคต?		บทนำ (Introduction)///การอภิปรายผล (Discussion)///บทคัดย่อ (Abstract)///วิธีการวิจัย (Methods)///ผลการวิจัย (Results)	การอภิปรายผล (Discussion)	ในส่วน Discussion (การอภิปรายผล) ผู้วิจัยจะทำการตีความผลลัพธ์ เปรียบเทียบกับงานวิจัยอื่น และระบุถึงข้อจำกัดของการศึกษา (Limitations) รวมถึงแนวทางหรือข้อเสนอแนะในการวิจัยขั้นต่อไป ส่วนข้อ D และ E เป็นการบรรยายวิธีและผลที่เกิดขึ้นจริง และข้อ A เป็นเพียงส่วนเริ่มต้นที่บอกเหตุผลของการทำวิจัยเท่านั้น	["COMMED_52FMT"]
COMMED_52FMT_91	91. อุปสรรคใดที่สำคัญที่สุดในการนำเวชศาสตร์อิงหลักฐานไปใช้ในเวชปฏิบัติ?		การขาดแคลนงานวิจัยทางการแพทย์ที่เพียงพอต่อการตัดสินใจทางคลินิก///ค่าใช้จ่ายในการเข้าถึงฐานข้อมูลงานวิจัยและแหล่งข้อมูลทางวิชาการ///ผู้ป่วยปฏิเสธการรักษาที่อิงตามหลักฐานเชิงประจักษ์///ข้อจำกัดด้านเทคโนโลยีหรือการเข้าถึงแหล่งข้อมูลเพื่อสืบค้นงานวิจัย///ข้อจำกัดด้านเวลาและทักษะในการค้นหา, ประเมิน, และนำหลักฐานเชิงประจักษ์มาประยุกต์ใช้	ข้อจำกัดด้านเวลาและทักษะในการค้นหา, ประเมิน, และนำหลักฐานเชิงประจักษ์มาประยุกต์ใช้	หัวใจของ Evidence-Based Medicine (EBM) คือกระบวนการ 5 ขั้นตอน (Ask, Acquire, Appraise, Apply, Assess) ซึ่งต้องการเวลาและทักษะการประเมินอย่างมีวิจารณญาณ แพทย์ส่วนใหญ่มักประสบปัญหาภาระงานหนักทำให้ไม่มีเวลาสืบค้นและประเมินงานวิจัยจำนวนมหาศาล ส่วนข้อ B และ D เป็นอุปสรรคเชิงโครงสร้างแต่ปัจจุบันฐานข้อมูลเปิดมากขึ้น (Open access) และข้อ A งานวิจัยส่วนใหญ่มีเพียงพอแต่อยู่ที่การนำมาคัดกรองใช้	["COMMED_52FMT"]

COMMED_52FMT_93	93. เมื่อมีการระบาดของโรคที่เกิดจากการติดเชื้อทางเดินหายใจชนิดใหม่ ข้อใดสามารถป้องกันการแพร่ระบาดของโรคอุบัติใหม่ในชุมชนได้ดีที่สุด?		การปิดโรงเรียน สถานที่ทำงาน///การเยี่ยมบ้านเพื่อดูแลครอบครัวและชุมชน///การฉีดวัคซีน///การกักตัว///การเผยแพร่สื่อเพื่อประชาสัมพันธ์การป้องกันโรค	การกักตัว	สำหรับโรคอุบัติใหม่ (Emerging diseases) ที่ยังไม่มีวัคซีน (ซึ่งเป็นข้อจำกัดของข้อ C) มาตรการที่ได้ผลดีที่สุดในการหยุดวงจรการแพร่กระจายในชุมชนคือการกักตัว (Quarantine/Isolation) และการรักษาระยะห่างเพื่อลดอัตราการสัมผัส ส่วนข้อ A เป็นส่วนหนึ่งของการจัดการแต่การกักตัวผู้ติดเชื้อ/กลุ่มเสี่ยงตรงจุดกว่า และข้อ E เป็นเพียงการสร้างความรู้ซึ่งความร่วมมืออาจแตกต่างกันไป	["COMMED_52FMT"]

COMMED_52FMT_95	95. โรงพยาบาลแห่งหนึ่งใช้การตรวจ 2 ชนิดวินิจฉัยโรคหัวใจขาดเลือด: การตรวจ A (Spec 90%, Sens 85%), การตรวจ B (Spec 98%, Sens 70%) หากใช้การตรวจร่วมกันโดยถือว่าผู้ป่วยเป็นโรคเมื่อผลตรวจอย่างน้อยหนึ่งอย่างเป็นบวก Specificity ของการตรวจร่วมกันนี้มีค่าเท่าใด?		98.2%///93.0%///88.2%///96.0%///99.9%	88.2%	เมื่อตรวจร่วมกันแบบ 'Parallel testing' (วินิจฉัยว่าเป็นโรคถ้า A หรือ B เป็นบวก) Sensitivity จะเพิ่มขึ้น แต่ Specificity จะลดลง สูตรการหา Combined Specificity คือ Spec A x Spec B = 0.90 x 0.98 = 0.882 หรือ 88.2% ส่วนข้อ A และ D เป็นค่าที่อาจสับสนกับการตรวจแบบ Serial testing (ต้องบวกทั้งคู่) ซึ่งจะทำให้ Specificity สูงขึ้นแต่ Sensitivity ลดลง	["COMMED_52FMT"]
COMMED_52FMT_96	96. ในกรณีใดต่อไปนี้ที่การเลือกใช้การทดสอบที่มี specificity สูงมีความสำคัญมากที่สุด?		การคัดกรองโรคร้ายแรงในประชากรทั่วไป///การยืนยันผลการตรวจคัดกรองก่อนการรักษาที่มีผลข้างเคียงรุนแรง///การตรวจหาโรคที่หายากในประชากร///การติดตามการรักษาผู้ป่วยที่ได้รับการวินิจฉัยแล้ว///การคัดกรองโรคในกลุ่มเสี่ยงสูง	การยืนยันผลการตรวจคัดกรองก่อนการรักษาที่มีผลข้างเคียงรุนแรง	High Specificity มีความสำคัญในขั้นตอน 'Confirmatory test' เพื่อยืนยันว่าผู้ที่ผลตรวจเป็นบวกนั้นเป็นโรคจริงๆ เพื่อป้องกันผลบวกปลอม (False positive) ซึ่งมีความสำคัญมากหากการรักษาต่อเนื่องนั้นมีอันตรายหรือค่าใช้จ่ายสูง (เช่น การผ่าตัดใหญ่หรือเคมีบำบัด) ส่วนข้อ A การคัดกรอง (Screening) มักต้องการ High Sensitivity เพื่อไม่ให้หลุดเคสที่แท้จริงไป	["COMMED_52FMT"]
COMMED_52FMT_97	97. ในในการคำนวณขนาดตัวอย่าง หากค่าปัจจัยอื่นคงที่ เมื่อ effect size (ขนาดความแตกต่างระหว่างกลุ่ม) เพิ่มขึ้น ขนาดตัวอย่างที่ต้องใช้จะเปลี่ยนแปลงอย่างไร?		ไม่เปลี่ยนแปลง///เพิ่มขึ้น///เพิ่มขึ้นแล้วลดลง///ลดลงแล้วเพิ่มขึ้น///ลดลง	ลดลง	Effect size คือขนาดของผลลัพธ์หรือความแตกต่างที่ผู้วิจัยต้องการตรวจจับ หากความแตกต่างระหว่างกลุ่มนั้นมีขนาดใหญ่ (Large effect size) สถิติจะตรวจพบได้ง่ายขึ้นแม้จะใช้จำนวนตัวอย่างเพียงเล็กน้อย ในทางตรงกันข้ามหากความแตกต่างน้อยมากต้องใช้ตัวอย่างจำนวนมากถึงจะเห็นความสำคัญทางสถิติ ดังนั้นขนาดตัวอย่างจึงแปรผกผันกับ Effect size ส่วนข้อ B ผิดเพราะหาก Effect size น้อยลงต่างหากที่ต้องใช้กลุ่มตัวอย่างเพิ่มขึ้น	["COMMED_52FMT"]
COMMED_52FMT_98	98. ในการศึกษา RCT ของยาลดความดันโลหิต มีผู้ป่วยบางรายในกลุ่ม intervention ไม่ได้ทานยาตาม protocol ที่กำหนด ผู้วิจัยจึงตัดผู้ป่วยกลุ่มนี้ออกจากการวิเคราะห์ และวิเคราะห์เฉพาะผู้ที่ปฏิบัติตาม protocol ครบถ้วน วิธีการวิเคราะห์นี้เรียกว่าอะไร?		Modified ITT analysis///Intention-to-treat analysis///Per-protocol analysis///As-treated analysis///Sensitivity analysis	Per-protocol analysis	Per-protocol analysis คือการวิเคราะห์เฉพาะผู้ป่วยที่ได้รับ Intervention ตามที่กำหนดไว้อย่างสมบูรณ์และไม่มีการทำผิดกฎการวิจัย (Protocol violation) ส่วนข้อ B Intention-to-treat (ITT) คือการวิเคราะห์ผู้ป่วยตามกลุ่มที่สุ่มไว้ตั้งแต่แรกไม่ว่าพวกเขาจะได้รับยาครบหรือไม่ ซึ่ง ITT ถือเป็น Gold standard ใน RCT เพื่อลด Bias ส่วนข้อ D As-treated คือวิเคราะห์ตามที่ได้รับจริงไม่ว่าจะสุ่มไปกลุ่มไหนก็ตาม	["COMMED_52FMT"]

        function handleLectureChange() {

        // ฟังก์ชันนำค่าจาก Input ไปใส่ใน Template แล้วแสดงผลใน Textarea
        function updatePrompt() {
            const num = document.getElementById('questionCount').value;
            const finalPrompt = promptTemplate.replace(/{{num}}/g, num);
            document.getElementById('myInput').value = finalPrompt;
        }

        // คัดลอกข้อความ
        function copyText() {
            var textArea = document.getElementById("myInput");
            textArea.select();
            navigator.clipboard.writeText(textArea.value).then(function () {
                showToast();
            });
        }

        function showToast() {
            var x = document.getElementById("toast");
            x.className = "show";
            setTimeout(function () { x.className = x.className.replace("show", ""); }, 3000);
        }

        // รันครั้งแรกเมื่อโหลดหน้า
        window.onload = updatePrompt;
