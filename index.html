<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือคัดลอกข้อความยาว</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }

        /* ส่วนควบคุมจำนวนข้อ */
        .settings-bar {
            background-color: #ebf5fb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            border: 1px solid #d6eaf8;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        select,
        input[type="number"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
        }

        input[type="number"] {
            width: 80px;
        }

        .text-area-wrapper {
            flex-grow: 1;
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #3498db;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-copy {
            background-color: #27ae60;
            color: white;
            flex: 2;
        }

        .btn-copy:hover {
            background-color: #219150;
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 50px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 600px) {
            .settings-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ปรับจำนวนข้อแล้วเอาไปวางตรง prompt ปกติได้เลยแล้วอัพไฟล์เลคเชอร์มันเร็วขึ้นมากๆๆๆ</h1>

        <!-- ส่วนปรับแต่งจำนวนข้อ -->
        <div class="settings-bar">
            <div class="input-group">
                <label for="lectureSelect">เลือกจำนวน Lecture:</label>
                <select id="lectureSelect" onchange="handleLectureChange()">
                    <option value="1">1 Lecture (25 ข้อ)</option>
                    <option value="2" selected>2 Lectures (35 ข้อ)</option>
                    <option value="3">3 Lectures (45 ข้อ)</option>
                    <option value="custom">ปรับแต่งเอง (Custom)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="questionCount">จำนวนข้อที่ต้องการ:</label>
                <input type="number" id="questionCount" value="35" min="1" max="100" oninput="updatePrompt()">
            </div>
        </div>

        <div class="text-area-wrapper">
            <textarea id="myInput" placeholder="กำลังโหลดข้อความ..."></textarea>
        </div>

        <div class="button-group">
            <button class="btn-copy" onclick="copyText()">คัดลอกข้อความทั้งหมด</button>
        </div>
    </div>

    <div id="toast">คัดลอกเรียบร้อยแล้ว! ✅</div>

    <script>
        // เก็บ Template ข้อความไว้ (แทนที่จำนวนข้อด้วย {{num}})
        const promptTemplate = `Act as a Senior Medical Education Specialist and JavaScript Developer.

Your task is to generate {{num}} high-quality medical questions based on the provided "Learning Objectives", "Slide Content", and "Sample Exam". You must output the result strictly as a valid JavaScript variable assignment.

Input Data:
1. Learning Objectives & Slides: [Insert Content Here]
2. Sample Exam Style: [Insert Sample Questions Here]

Output Format:
Generate a single variable assignment:
var allquestionN = [ ... ];

Object Structure (Must be exact):
{
    problem: "Question text here (English)",
    img: "",
    choices: "Choice1///Choice2///Choice3///Choice4///Choice5",
    answer: "Correct Answer (English)",
    select: "",
    explain: "Explanation here (Thai + Medical Terms)",
    state: false
}

STRICT RULES & LOGIC:

1. Question Design (Mimic Sample Exam Style):
   - Content: Generate questions covering Basic Science, Clinical Diagnosis, and Management based on the input topics.
   - Style: Use "Clinical Vignettes" (Case scenarios). Include Age, Gender, Chief Complaint, HPI, Vital Signs, and Lab values where appropriate (e.g., "A 45-year-old male presents with... BP 140/90...") Or basic science questions that require analytical thinking before arriving at an answer.
   - Complexity: Moderate to Hard. Focus on "Why" (Mechanism) and "What is the next best step" rather than simple recall.
   - Language: Problem and Choices must be in ENGLISH.
   - Numbering: Start the problem text with the number (e.g., "1. A patient...").

2. Choices Formatting (Strict Syntax):
   - Provide exactly 5 choices per question.
   - Use exactly "///" as the separator.
   - CRITICAL: Do NOT put any spaces before or after "///" (Correct: "A///B///C", Incorrect: "A /// B").
   - Distractors: Must be plausible medical distractors. Avoid obvious wrong answers. Choices should be homogeneous in length and grammatical structure.

3. Answer Matching:
   - The answer property must be an EXACT string match to one of the segments in the choices string.

4. Explanation Logic (High-Quality Clinical Reasoning):
   - The explanation must be structured using Clinical Reasoning (ไทย ผสมกับ English medical terminology). Follow this content for every question (written as a continuous professional paragraph):
     - Key Concept Start by identifying the diagnosis based on the key findings in the vignette (symptoms, labs).
     - Supporting Evidence (Why Correct?) Explain why the correct answer is the "Gold Standard" or "Best Step". Cite specific clues from the question.
     - Systematic Rule-Out (CRITICAL) briefly explain why EACH of the other 4 distractors is incorrect.
        - Example style: "ส่วนข้อ B ผิดเพราะ... (Incorrect because...)", "ข้อ C มักใช้ในกรณี... แต่ผู้ป่วยรายนี้...".
     - Clinical Pearl (Optional) Add "High-Yield" fact useful for exams.
     - Write the explanation like someone were explaining it, and rephrasing the sentences.
    Tone: Professional yet easy to digest for medical students. Never use repetitive phrases like "The correct answer is A." or "คำตอบที่ถูกต้องคือ A" Go straight to the reasoning.
5. Technical Constraints (JavaScript Safety):
   - Output ONLY the code. No markdown conversational text before/after.
   - String Safety: Do NOT use line breaks (
) inside strings. Keep everything on a single line.
   - Escape Characters: Carefully escape double quotes inside strings if necessary (e.g., "text").
   - Default Values: Keep img: "", select: "", and state: false.

Start processing the input content now and generate the allquestionN array.

[SAMPLE EXAM] - for style reference.

QuestionID	Problem	Image	Choices	Answer	Explanation	Category
COMMED_51MCQ_1	5. Men who are adhered to medication: 150. Men who aren't adhered to medication: 100. Women who are adhered to medication: 200. Women who aren't adhered to medication: 150. Find the ratio between the men who are adhered to medication among the men who aren't adhered to medication		150/600///150/100///150/250///150/200///150/350	150/100	โจทย์ถามหา Ratio (อัตราส่วน) ระหว่างกลุ่มผู้ชายที่กินยาครบ (adhered) ต่อกลุ่มที่กินยาไม่ครบ (not adhered) โดยใช้สูตร Ratio = a/b ดังนั้นคำตอบคือ 150/100 ส่วนข้อ 150/250 คือ Proportion ของผู้ชายที่กินยาครบเทียบกับผู้ชายทั้งหมด และ 150/600 คือ Proportion เทียบกับประชากรทั้งหมด ซึ่งไม่ใช่สิ่งที่โจทย์ต้องการ Clinical Pearl: Ratio คือการเปรียบเทียบของสองสิ่งที่แยกจากกันชัดเจน (Numerator is not part of denominator) ต่างจาก Proportion ที่ตัวเศษเป็นส่วนหนึ่งของตัวส่วน	["COMMED_51MCQ"]
COMMED_51MCQ_2	20. ต้องการทดสอบยารักษาไข้หวัดใหญ่สายพันธุ์ A โดยให้คนไข้ได้ยาที่ 1 150 คน ยาที่ 2 150 คน แต่พบว่าจริงๆแล้ว มีคนไข้ใช้ยาที่ 1 160 คน และยาที่ 2 140 คน แต่ต้องการวิเคราะห์เป็น คนไข้ได้ยาที่ 1 150 คน ยาที่ 2 150 คน จะต้องใช้การวิเคราะห์แบบใด		Intention-to-treat analysis///Per-protocol analysis///As treated analysis///Modified ITT's analysis///Subgroup analysis	Intention-to-treat analysis	การวิเคราะห์ที่ยึดตามกลุ่มที่สุ่มไว้ตั้งแต่ต้น (Randomized group) แม้ว่าคนไข้จะเปลี่ยนกลุ่มยาหรือกินยาไม่ครบในภายหลัง เรียกว่า Intention-to-treat (ITT) analysis เพื่อป้องกัน Selection bias และรักษาคุณสมบัติของการ Randomization ส่วน Per-protocol analysis จะวิเคราะห์เฉพาะคนที่ทำตาม protocol ครบถ้วน และ As treated analysis จะวิเคราะห์ตามยาที่ได้รับจริง ซึ่งทั้งสองแบบหลังมักทำให้เกิด Bias ได้ Clinical Pearl: ITT ช่วยให้ผลการศึกษาสะท้อนถึง Real-world effectiveness ได้ดีกว่า	["COMMED_51MCQ"]
COMMED_51MCQ_3	24. ข้อใดอธิบายถึง Health belief model (HBM) ได้ถูกต้อง		ผู้ป่วยเชื่อว่าตัวเองมีความเสี่ยงที่เป็นเบาหวาน เพราะมีพ่อเป็นเบาหวาน///การรณรงค์ให้เลิกบุหรี่โดยใช้ดารามาโปรโมท///ผู้ป่วยเชื่อว่าตัวเองสามารถลดน้ำหนักได้///ผู้ป่วยทราบถึงผลข้างเคียงของการรักษา///ผู้ป่วยกังวลเรื่องค่าใช้จ่ายในการเดินทางไปโรงพยาบาล	ผู้ป่วยเชื่อว่าตัวเองมีความเสี่ยงที่เป็นเบาหวาน เพราะมีพ่อเป็นเบาหวาน	Health Belief Model (HBM) ประกอบด้วยหลายปัจจัย โดยข้อแรกคือ Perceived Susceptibility หรือการรับรู้ความเสี่ยงของตนเองต่อโรค ซึ่งตรงกับตัวเลือกที่ผู้ป่วยเชื่อว่าเสี่ยงเพราะประวัติครอบครัว ส่วนการรณรงค์โดยใช้ดาราคือ Cues to action และความมั่นใจว่าจะลดน้ำหนักได้คือ Self-efficacy ส่วนค่าเดินทางคือ Perceived barriers Clinical Pearl: HBM เน้นที่ความเชื่อและการรับรู้ส่วนบุคคลเป็นหลักในการทำนายพฤติกรรมสุขภาพ	["COMMED_51MCQ"]
COMMED_51MCQ_4	28. ข้อใดคือวัตถุประสงค์ของการกักกัน (quarantine)		เพื่อควบคุมการแพร่ระบาดโดยแยกผู้ที่อาจได้รับเชื้อออกจากประชากรทั่วไป///ทำให้ผู้ป่วยได้รับการรักษาโดยเร็วที่สุด///ทำให้ประชากรตื่นตัวในการป้องกันโรค///ลดการเสียชีวิตในผู้ป่วยที่มีอาการรุนแรง///การฟื้นตัวของผู้ป่วย	เพื่อควบคุมการแพร่ระบาดโดยแยกผู้ที่อาจได้รับเชื้อออกจากประชากรทั่วไป	Quarantine คือการจำกัดบริเวณผู้สัมผัสโรค (Contact) ที่ยังไม่แสดงอาการแต่มีประวัติเสี่ยง เพื่อรอดูอาการและป้องกันการแพร่เชื้อสู่ผู้อื่นในช่วงระยะฟักตัว ต่างจาก Isolation (การแยกกัก) ที่ใช้กับผู้ที่มีอาการหรือตรวจพบเชื้อแล้ว ส่วนตัวเลือกอื่นๆ เกี่ยวข้องกับการรักษาผู้ป่วยรายบุคคลมากกว่าการควบคุมโรคในระดับระบาดวิทยา Clinical Pearl: Quarantine ใช้สำหรับ Asymptomatic contacts ในขณะที่ Isolation ใช้สำหรับ Symptomatic or Confirmed cases	["COMMED_51MCQ"]
COMMED_51MCQ_5	30. ปัจจัยใดส่งผลต่อสุขภาวะมากที่สุด		อายุ///เพศ///พฤติกรรมสุขภาพ///ศาสนา///พันธุกรรม	พฤติกรรมสุขภาพ	ตามหลัก Determinants of Health พฤติกรรมสุขภาพ (Health Behavior/Lifestyle) เช่น การสูบบุหรี่ การออกกำลังกาย และนิสัยการบริโภค เป็นปัจจัยที่ส่งผลต่อสุขภาวะและอัตราการตายมากที่สุด (ประมาณ 40-50%) มากกว่าพันธุกรรม (Genetic) หรือระบบสาธารณสุขเสียอีก ส่วนอายุและเพศเป็นปัจจัยที่แก้ไขไม่ได้ (Non-modifiable factors) Clinical Pearl: การปรับเปลี่ยนพฤติกรรม (Behavior modification) เป็นหัวใจสำคัญของการส่งเสริมสุขภาพ	["COMMED_51MCQ"]
COMMED_51MCQ_6	37. Which of the following studies is the best suited to establish a temporal relationship between the exposure and the outcome?		Case-control study///Cohort study///Ecological study///Case series///Cross-sectional study	Cohort study	Cohort study เริ่มต้นจากกลุ่มที่ได้รับ Exposure แล้วติดตามไปข้างหน้าเพื่อดูการเกิด Outcome (Prospective) ทำให้ยืนยันได้ชัดเจนว่าปัจจัยเสี่ยงเกิดขึ้นก่อนโรค (Temporal sequence) ส่วน Case-control และ Cross-sectional มักมีปัญหาเรื่อง Protopathic bias หรือความไม่ชัดเจนว่าสิ่งใดเกิดก่อนกัน Clinical Pearl: Temporal relationship เป็นหนึ่งใน Hill's criteria สำหรับการระบุ Causality ที่สำคัญและชัดเจนที่สุดใน Cohort study	["COMMED_51MCQ"]
COMMED_51MCQ_7	39. A case-control study ศึกษา association between aspirin and Reye’s syndrome. พบ OR = 10.2 (95%CI : 5.2-21.4) ข้อไหนถูก		Aspirin increase risk of Reye's syndrome by 10 times///There's a statistical significance between aspirin and Reye's syndrome.///Reye's syndrome has no statistical significance to aspirin users.///Aspirin is a protective factor for Reye's syndrome.///A case-control study doesn't use odds ratios.	There's a statistical significance between aspirin and Reye's syndrome.	จากผลลัพธ์ OR = 10.2 และ 95% CI (5.2-21.4) ซึ่งช่วงความเชื่อมั่นไม่ครอบคลุมค่า 1.0 (Null value) แสดงว่ามีความแตกต่างอย่างมีนัยสำคัญทางสถิติ (Statistically significant) ส่วนข้อที่บอกว่าเพิ่มความเสี่ยง 10 เท่านั้นยังไม่เป๊ะทีเดียวเพราะ OR ไม่ใช่ Risk ratio แม้จะใกล้เคียงกันในกรณีที่โรคพบน้อย และค่า OR ที่มากกว่า 1 แสดงว่าเป็น Risk factor ไม่ใช่ Protective factor Clinical Pearl: เมื่อ 95% CI ของ OR ไม่คร่อม 1 แสดงว่าค่า p-value < 0.05	["COMMED_51MCQ"]

COMMED_51MCQ_23	122. The surveillance data shows an increased rate of abnormal chest X-ray finding in sandstone manufacturing worker. What is the most likely causative agent?		Asbestos///Respirable crystalline silica///Carbon monoxide///Coal dust///Lead	Respirable crystalline silica	การทำงานที่สัมผัสหินทราย (Sandstone) มีความเสี่ยงสูงต่อการสูดดมฝุ่น Silica ซึ่งก่อให้เกิดโรค Silicosis โดยจะพบความผิดปกติใน Chest X-ray เป็นจุดเล็กๆ (Nodular opacities) ส่วน Asbestos จะสัมพันธ์กับงานฉนวนหรือเบรก และ Coal dust สัมพันธ์กับเหมืองถ่านหิน Clinical Pearl: ผู้ป่วย Silicosis มีความเสี่ยงต่อการติดเชื้อวัณโรค (TB) สูงกว่าประชากรทั่วไปอย่างมาก	["COMMED_51MCQ"]
COMMED_51MCQ_24	131. ข้อใดกล่าวถูกต้องเกี่ยวกับ PPV		เป็นสัดส่วนของคนที่มีผลเป็นบวกและเป็นโรคจริงต่อคนที่มีผลเป็นบวกทั้งหมด///สัดส่วนของคนที่มีผลเป็นลบและไม่เป็นโรคต่อคนที่มีผลเป็นลบทั้งหมด///ค่าคงที่ความชุกไม่มีผล///สัดส่วนของคนที่มีผลเป็นลบและไม่เป็นโรคต่อคนที่ไม่เป็นโรคทั้งหมด///บอกความสามารถของเครื่องมือ ในการคัดกรอง	เป็นสัดส่วนของคนที่มีผลเป็นบวกและเป็นโรคจริงต่อคนที่มีผลเป็นบวกทั้งหมด	PPV (Positive Predictive Value) คือค่าพยากรณ์ผลบวก หมายถึงในบรรดาคนที่ผลตรวจเป็นบวกทั้งหมด มีกี่คนที่ป่วยเป็นโรคจริง (TP / (TP+FP)) ส่วนข้อที่บอกว่าความชุกไม่มีผลนั้นผิด เพราะ PPV จะสูงขึ้นเมื่อความชุกของโรคในประชากรสูงขึ้น Clinical Pearl: PPV และ NPV ขึ้นอยู่กับความชุกของโรค (Prevalence) ในขณะที่ Sensitivity และ Specificity เป็นคุณสมบัติเฉพาะของตัวตรวจวัด	["COMMED_51MCQ"]
COMMED_50MCQ_1	1. การตรวจฉีดวัคซีนไข้หวัดใหญ่ประจำปีในผู้สูงอายุเป็นการป้องกันระดับใด		Primordial prevention///Primary prevention///Secondary prevention///Tertiary prevention///Quaternary prevention	Primary prevention	การฉีดวัคซีนไข้หวัดใหญ่เป็นการสร้างภูมิคุ้มกันเพื่อป้องกันไม่ให้เกิดโรคตั้งแต่แรก (Pre-pathogenesis stage) จึงจัดเป็น Primary prevention ซึ่งเน้นการลดอุบัติการณ์ (Incidence) ของโรคในกลุ่มประชากรที่ยังไม่เป็นโรค สำหรับ Primordial prevention คือการจัดการปัจจัยเสี่ยงในระดับนโยบายหรือสิ่งแวดล้อมเพื่อไม่ให้มีปัจจัยเสี่ยงเกิดขึ้น ส่วน Secondary prevention คือการคัดกรองเพื่อรักษาตั้งแต่ระยะเริ่มแรก Tertiary prevention คือการฟื้นฟูสภาพหลังเป็นโรค และ Quaternary prevention คือการป้องกันการรักษาที่เกินความจำเป็น (Over-medicalization)	["COMMED_50MCQ"]
COMMED_50MCQ_2	2. ข้อใดถูกต้องเกี่ยวกับ community medicine		Community medicine ไม่จำเป็นต้องใช้ความรู้ทาง epidemiological and statistical///Community medicine เน้นการดูแลแบบ preventive///Community medicine เน้นการรักษาผู้ป่วยเฉพาะรายในโรงพยาบาลเป็นหลัก///Community medicine ไม่เกี่ยวข้องกับการวางแผนนโยบายสาธารณสุข///Community medicine ให้ความสำคัญกับความพึงพอใจของผู้ป่วยมากกว่าสุขภาพชุมชน	Community medicine เน้นการดูแลแบบ preventive	Community Medicine หรือเวชศาสตร์ชุมชนเน้นหลักการดูแลสุขภาพเชิงรุกโดยเน้นการส่งเสริมสุขภาพและป้องกันโรค (Preventive aspect) ในระดับประชากร การอธิบายว่าไม่จำเป็นต้องใช้ระบาดวิทยา (Epidemiology) และสถิตินั้นผิด เพราะทั้งสองเป็นเครื่องมือหลักในการวิเคราะห์ปัญหาสุขภาพชุมชน ส่วนการรักษาเฉพาะรายในโรงพยาบาล (Curative) เป็นบทบาทหลักของ Clinical Medicine และวิชานี้ต้องเกี่ยวข้องกับการวางแผนนโยบายเพื่อแก้ปัญหาสุขภาพในวงกว้าง	["COMMED_50MCQ"]
COMMED_50MCQ_3	3. ข้อใดคือประโยชน์ของ epidemiology		ศึกษาการระบาดของโรค///ใช้บอกการดำเนินไปของโรครายบุคคล///ใช้รายงานในแบบรายงาน 506///ใช้เพื่อเป็นองค์ความรู้มาพัฒนายา///เพื่อการรักษาแบบประคับประคองในระยะสุดท้าย	ศึกษาการระบาดของโรค	Epidemiology หรือระบาดวิทยาคือการศึกษาการกระจาย (Distribution) และปัจจัยกำหนด (Determinants) ของภาวะที่เกี่ยวกับสุขภาพในประชากรเฉพาะกลุ่ม ประโยชน์หลักจึงเป็นการศึกษาการระบาดและหาสาเหตุของโรคในระดับกลุ่มคน ส่วนการบอกการดำเนินโรครายบุคคลเป็นหน้าที่ของ Clinical medicine การรายงาน 506 เป็นเพียงระบบ Surveillance ซึ่งเป็นส่วนหนึ่งของระบาดวิทยาแต่ไม่ใช่จุดประสงค์ทั้งหมด และการพัฒนายามักเป็นบทบาทของ Pharmacology และ Clinical Trials แม้ระบาดวิทยาจะช่วยสนับสนุนข้อมูลพื้นฐานก็ตาม	["COMMED_50MCQ"]
COMMED_50MCQ_4	4. มีไข้หวัดใหญ่ในเด็กโรงเรียนประจำ 30 คน เข้ารับการรักษาตัวในโรงพยาบาล หากท่านเป็นแพทย์ผู้รับผิดชอบพื้นที่ ท่านจะทำอะไรเป็นอย่างแรกของการสอบสวนโรค		รักษาไข้หวัดใหญ่ของนักเรียนทั้ง 30 คน///Active finding case ในโรงเรียนประจำ///ทำความสะอาดโรงเรียน///ยืนยันการระบาด///ยืนยันการเป็นโรค	ยืนยันการเป็นโรค	ตามขั้นตอนการสอบสวนโรค (Outbreak investigation) ขั้นตอนแรกที่ต้องทำหลังจากเตรียมการคือการยืนยันการวินิจฉัย (Verify diagnosis) หรือยืนยันการเป็นโรค เพื่อให้แน่ใจว่าผู้ป่วยทุกรายป่วยด้วยโรคเดียวกันจริงๆ ก่อนจะไปสู่ขั้นตอนการยืนยันการระบาด (Confirm existence of outbreak) โดยเปรียบเทียบกับจำนวนเคสปกติ ส่วนการรักษาเป็นหน้าที่พื้นฐานแต่ไม่ใช่ขั้นตอนแรกของการสอบสวน การทำความสะอาดโรงเรียน (Control measures) และการค้นหาผู้ป่วยเชิงรุก (Active case finding) จะทำในลำดับถัดมาหลังยืนยันโรคและการระบาดแล้ว	["COMMED_50MCQ"]
COMMED_50MCQ_5	5. ในกลางเดือนธันวาคม 2563 กรมควบคุมโรค กระทรวงสาธารณสุข รายงานการติดเชื้อ SARS-CoV-2 ในแรงงานต่างด้าวที่ทำงานที่ตลาดกลางกุ้ง จ.สมุทรสาคร โดยพบมากกว่า 500 รายและเพิ่มจำนวนมากขึ้นเรื่อยๆ โดยการตรวจ Real time PCR nasopharyngeal swab ในแรงงานต่างด้าวทุกคนที่ตลาดกลางกุ้ง คำอธิบายดังกล่าว สอดคล้องกับกระบวนการใด		ขั้นตอนการทำ Case definition///การยืนยันการระบาดของการติดเชื้อ SARS-CoV-2///การเฝ้าระวังการติดเชื้อ SARS-CoV-2 ในกลุ่มเสี่ยง///การทำวิจัยเพื่อศึกษาลักษณะการกระจายของโรค///การหา case เพิ่มเติมในการสอบสวนโรคทางระบาดวิทยา	การหา case เพิ่มเติมในการสอบสวนโรคทางระบาดวิทยา	การตรวจคัดกรองแรงงานทุกคนในพื้นที่ที่เกิดเหตุ (ตลาดกลางกุ้ง) หลังจากพบผู้ติดเชื้อเบื้องต้น จัดเป็นการค้นหาผู้ป่วยรายใหม่ (Case finding) หรือ Active Case Finding เพื่อค้นหาขอบเขตของการแพร่ระบาด ซึ่งเป็นส่วนสำคัญในการสอบสวนโรค ไม่ใช่เพียงการเฝ้าระวัง (Surveillance) ปกติ เพราะเป็นการลงพื้นที่คัดกรองเชิงรุกเมื่อมีการระบาดเกิดขึ้นแล้ว ส่วน Case definition คือการตั้งเกณฑ์การรับเคส และการยืนยันการระบาดคือการวิเคราะห์ว่าจำนวนเคสเกินกว่าปกติหรือไม่	["COMMED_50MCQ"]
COMMED_50MCQ_6	6. มี Walking pneumonia เกิดขึ้นในโรงเรียนพลตำรวจ มีนักเรียนพลตำรวจอยู่หอพักเดียวกัน 400 คน เหตุการณ์นี้เรียกว่า		Endemic///Epidemic///Pandemic///Sporadic///Systemic	Epidemic	การเกิดโรคในกลุ่มคนที่มีความเชื่อมโยงกันในพื้นที่และเวลาเดียวกัน (เช่น โรงเรียนพลตำรวจ) ในจำนวนที่มากผิดปกติ เรียกว่า Epidemic หรือการระบาด สำหรับ Endemic หมายถึงโรคประจำถิ่นที่มีอัตราคงที่ Pandemic คือการระบาดใหญ่ทั่วโลก Sporadic คือการเกิดโรคประปรายไม่มีความเชื่อมโยงกัน และ Systemic ไม่ใช่คำศัพท์ทางระบาดวิทยาที่ใช้อธิบายลักษณะการกระจายของโรคในลักษณะนี้	["COMMED_50MCQ"]
COMMED_50MCQ_7	7. การระบาดของโรคคืออะไร		Outbreak คือมีจำนวนเหตุการณ์เกิดขึ้นในพื้นที่เดียวกันมากกว่าปีที่ผ่านมา///ทีม SRRT ลงพื้นที่ตรวจสอบโรค Sars///พยาบาลเป็นโรคสุกใส 2 คน///The การระบาดคือการพบโรคที่มีแหล่งระบาด///การพบผู้ป่วยประปรายในหลายจังหวัด	Outbreak คือมีจำนวนเหตุการณ์เกิดขึ้นในพื้นที่เดียวกันมากกว่าปีที่ผ่านมา	ความหมายของการระบาด (Outbreak/Epidemic) คือการพบจำนวนผู้ป่วยเกินกว่าค่าปกติที่คาดหมายไว้ (Expected) ในพื้นที่และช่วงเวลาที่กำหนด โดยมักเทียบกับค่าเฉลี่ยในอดีตหรือปีก่อนหน้า ส่วนข้ออื่นๆ เช่น ทีม SRRT เป็นเพียงการปฏิบัติงาน พยาบาลเป็นโรคสุกใส 2 คนอาจไม่ใช่การระบาดหากเป็นเรื่องปกติที่พบได้ หรือการพบโรคประปรายจะเรียกว่า Sporadic	["COMMED_50MCQ"]
COMMED_50MCQ_8	9. What is the most important characteristic of a health indicator?		Popularity///Validity///Security///Accessibility///measurability	Validity	ตัวชี้วัดสุขภาพ (Health Indicator) ที่ดีต้องมีคุณสมบัติที่สำคัญที่สุดคือ Validity หรือความถูกต้องแม่นยำ (ตรงกับสิ่งที่ต้องการวัดจริงๆ) คุณสมบัติอื่นๆ เช่น Measurability (วัดได้จริง) หรือ Sensitivity/Specificity ก็สำคัญ แต่หากไม่มี Validity ตัวชี้วัดนั้นก็ไม่สามารถสะท้อนสถานะสุขภาพที่แท้จริงได้ ส่วน Popularity หรือ Security ไม่ใช่เกณฑ์มาตรฐานในการประเมิน Health indicator	["COMMED_50MCQ"]
COMMED_50MCQ_9	10. หากต้องการหา incidence การเกิดโรคหัวใจล้มเหลวในผู้ที่ดื่มแอลกอฮอล์เปรียบเทียบกับผู้ที่ไม่ดื่มแอลกอฮอล์ควรเลือกการวิจัยแบบใดจึงจะเหมาะสมที่สุด		Cohort study///Case control study///Cross sectional study///Descriptive study///RCT	Cohort study	การศึกษาเพื่อหาอุบัติการณ์ (Incidence) หรือการเกิดโรคใหม่ ต้องใช้การศึกษาที่ติดตามจากกลุ่มที่ยังไม่เป็นโรคไปในอนาคต (Prospective) ซึ่งก็คือ Cohort study โดยแบ่งกลุ่มตามปัจจัยเสี่ยง (Exposure) คือการดื่มแอลกอฮอล์ สำหรับ Case-control ใช้หา Odds Ratio ในโรคที่เกิดไปแล้ว Cross-sectional วัด ณ จุดเวลาเดียวหาความชุก (Prevalence) และ RCT เป็นการแทรกแซงซึ่งอาจไม่จริยธรรมหากสั่งให้คนดื่มแอลกอฮอล์เพื่อดูการเกิดโรค	["COMMED_50MCQ"]
COMMED_50MCQ_10	11. นักศึกษาแพทย์ชั้นปีที่ 5 ทำการศึกษาความเสี่ยงที่สัมพันธ์กับการเกิดโรคมะเร็งตับอ่อนซึ่งเป็นมะเร็งที่พบได้ไม่บ่อยนัก ควรใช้การศึกษาแบบใด		Descriptive study///Cohort study///Case control study///Cross-sectional study///RCT	Case control study	ในกรณีที่ศึกษาโรคที่พบได้น้อย (Rare disease) เช่น มะเร็งตับอ่อน การศึกษาแบบ Case-control study เหมาะสมที่สุด เพราะสามารถเริ่มต้นจากกลุ่มคนที่เป็นโรค (Cases) และหากลุ่มควบคุม (Controls) มาเปรียบเทียบหาปัจจัยเสี่ยงในอดีตได้ทันที หากใช้ Cohort study จะต้องใช้กลุ่มตัวอย่างจำนวนมหาศาลและใช้เวลานานมากเพื่อให้เกิดเคสเพียงพอสำหรับการวิเคราะห์	["COMMED_50MCQ"]
COMMED_50MCQ_11	13. ผู้ป่วยเข้ารับการรักษา/เข้าร่วมการวิจัย โดยไม่ทราบว่าตนเองอยู่ในกลุ่ม control หรือ treatment เพียงผู้เดียว		Unblind///Open label///Single blind///Double blind///Triple blind	Single blind	การที่ผู้เข้าร่วมวิจัย (Subject) ไม่ทราบว่าตนเองได้รับยาจริงหรือยาหลอก แต่ผู้วิจัยทราบ เรียกว่า Single blind หากทั้งผู้ป่วยและผู้วิจัยไม่ทราบจะเรียกว่า Double blind และหากรวมไปถึงผู้ที่วิเคราะห์ข้อมูลไม่ทราบด้วยจะเรียกว่า Triple blind สำหรับ Open label คือทุกฝ่ายทราบข้อมูลทั้งหมดไม่มีการปกปิด	["COMMED_50MCQ"]

COMMED_49MCQ_36	36. ควรใช้สถิติใด เมื่อต้องการทดสอบความสัมพันธ์ระหว่าง การทานอาหารรสเค็มจัด (yes,no) กับการป่วยเป็นโรคความดันโลหิตสูง (yes,no) และแปลผลด้วยค่า p-value		Odds ratio///Risk ratio///Student's T test///Pearson chi-square///Pearson correlation	Pearson chi-square	การทดสอบสมมติฐานเพื่อหาความสัมพันธ์ระหว่างตัวแปรเชิงกลุ่ม (Nominal scale) สองตัวแปร คือการทานอาหารเค็ม (ใช่/ไม่ใช่) และการป่วย (ใช่/ไม่ใช่) เพื่อให้ได้ค่า p-value ต้องใช้ Chi-square test ส่วน Pearson correlation ใช้สำหรับข้อมูลเชิงปริมาณ และ t-test ใช้เทียบค่าเฉลี่ย Clinical Pearl: Nominal x Nominal = Chi-square	["COMMED_49MCQ"]
COMMED_49MCQ_37	37. The surveillance system data show an increased rate of abnormal chest x-ray findings in people, primarily work in sandstone manufacturing. What is causative agent?		Talc///Iron///Silica///Carbon///Asbestos	Silica	การทำงานในอุตสาหกรรมเครื่องหินทราย (Sandstone manufacturing) หรือการโม่หิน มีความเสี่ยงหลักต่อการสูดดมฝุ่นละอองของ Silica ซึ่งทำให้เกิดโรค Silicosis โดย X-ray จะพบลักษณะผิดปกติแบบปุ่มขนาดเล็ก (Small nodules) ทั่วปอด ข้อ E. Asbestos พบในงานกระเบื้องมุงหลังคาหรืองานรื้อถอนอาคาร ข้อ A. Talc พบในอุตสาหกรรมแป้ง Clinical Pearl: Sandstone = Silicosis	["COMMED_49MCQ"]
COMMED_48MCQ_1	1. การตรวจคัดกรอง เป็นการป้องกันระดับใด		Primary prevention///Secondary prevention///Tertiary prevention///Primordial prevention///Quaternary prevention	Secondary prevention	การตรวจคัดกรอง (Screening) จัดเป็น Secondary prevention เนื่องจากมีวัตถุประสงค์เพื่อการค้นหาโรคในระยะแรกที่ยังไม่แสดงอาการ (Early detection) เพื่อให้ได้รับการรักษาที่รวดเร็ว (Prompt treatment) และลดความพิการหรือการลุกลามของโรค ส่วนข้อ A ผิดเพราะ Primary prevention คือการป้องกันก่อนเกิดพยาธิสภาพ เช่น การฉีดวัคซีนหรือการส่งเสริมสุขภาพ ข้อ C ผิดเพราะ Tertiary prevention คือการฟื้นฟูสภาพ (Rehabilitation) หลังเกิดโรคแล้ว ข้อ D ผิดเพราะ Primordial prevention เป็นการจัดการปัจจัยเสี่ยงในระดับโครงสร้างหรือนโยบาย และข้อ E ผิดเพราะ Quaternary prevention คือการป้องกันผู้ป่วยจากการตรวจหรือรักษาที่เกินความจำเป็น (Over-medicalization) Clinical Pearl: ท่องง่ายๆ ว่า Primary = ป้องกัน, Secondary = คัดกรอง, Tertiary = ฟื้นฟู	["COMMED_48MCQ"]
COMMED_48MCQ_2	8. ผู้หญิงอายุ 18 ปี ทำงานที่ leather bag industry มีอาการ muscle weakness, numbness and wrist drop ถามว่าสาเหตุเกิดจากอะไร		N-Hexane///Asbestos///Chromium///Lead///Benzene	N-Hexane	ในอุตสาหกรรมเครื่องหนัง (Leather bag industry) สารเคมีที่เป็นสาเหตุสำคัญของอาการทางระบบประสาทคือ N-Hexane ซึ่งพบมากในกาว (Glue) โดยสารนี้จะทำให้เกิด Peripheral neuropathy แบบ Symmetric และมีอาการเด่นคือ Muscle weakness และ Wrist drop ได้ ส่วนข้อ B ผิดเพราะ Asbestos เกี่ยวข้องกับโรคปอด (Asbestosis) และมะเร็งเยื่อหุ้มปอด ข้อ C ผิดเพราะ Chromium มักทำให้เกิดการระคายเคืองผิวหนังหรือแผล (Chrome hole) ข้อ D ผิดเพราะ Lead ทำให้เกิด Wrist drop ได้จริงแต่มักพบในโรงงานแบตเตอรี่หรือหลอมโลหะ และข้อ E ผิดเพราะ Benzene สัมพันธ์กับการเกิด Leukemia และ Aplastic anemia Clinical Pearl: หากโจทย์พูดถึงกาวหรือโรงงานรองเท้า/กระเป๋า ให้นึกถึง N-Hexane เสมอ	["COMMED_48MCQ"]
COMMED_48MCQ_3	11. A 34 years-old woman working in the leather bag industry came to the hospital with a clinical of muscle weakness and numbness. Physical examination showed wrist drops in both sides. Which chemical is the most relevant to her presentation?		N-Hexane///Chromium///Benzene///Lead///Asbestos	N-Hexane	The patient presents with bilateral wrist drops and peripheral neuropathy while working in the leather bag industry. The most likely culprit is N-Hexane exposure from solvent-based glues. N-Hexane causes distal axonal degeneration. ส่วนข้อ B (Chromium) เกี่ยวกับ Dermatitis และ Nasal septum perforation, ข้อ C (Benzene) เกี่ยวกับ Hematologic toxicity, ข้อ D (Lead) แม้จะทำให้เกิด Motor neuropathy (Wrist drop) ได้แต่ประวัติการทำงานในโรงงานเครื่องหนังจะชี้นำไปทาง N-Hexane มากกว่า และข้อ E (Asbestos) ส่งผลต่อระบบทางเดินหายใจเป็นหลัก Clinical Pearl: N-Hexane neuropathy is a classic occupational medicine case in footwear and leather industries.	["COMMED_48MCQ"]
COMMED_48MCQ_4	12. A 45 years old man working in a rice mill was diagnosed with pulmonary edema. Which agent can cause this symptom?		Sulfur dioxide///Moldy hay///Chloride gas///Rice hull///Phosphine gas	Phosphine gas	ในโรงสีข้าว (Rice mill) มีการใช้สาร Aluminum phosphide ในการรมควัน (Fumigation) เพื่อกำจัดมอดและแมลง ซึ่งจะปลดปล่อย Phosphine gas ออกมา สารนี้เป็นพิษรุนแรงและก่อให้เกิด Non-cardiogenic pulmonary edema ได้ ส่วนข้อ A และ C ผิดเพราะเป็นก๊าซระคายเคืองที่พบในโรงงานอุตสาหกรรมอื่น ข้อ B (Moldy hay) สัมพันธ์กับ Farmer's lung (Hypersensitivity pneumonitis) และข้อ D (Rice hull) อาจทำให้เกิด Silicosis หรือฝุ่นละอองระคายเคืองแต่ไม่ทำให้เกิด Pulmonary edema เฉียบพลัน Clinical Pearl: Phosphine gas exposure is a high-risk factor for workers in grain storage and shipping industries.	["COMMED_48MCQ"]
COMMED_48MCQ_5	13. พิมอยากเลิกเสพยาบ้า จึงตัดสินใจเลิกคบกับเพื่อนที่เสพยาบ้าด้วยกัน การปรับเปลี่ยนพฤติกรรม เหมือนกับ Health belief model ข้อใด		Perceived benefits///Perceived barrier///Perceived Severity///Cues to action///Perceived Susceptibility	Cues to action	การเลิกคบเพื่อนที่เสพยาถือเป็นการกำจัดสิ่งกระตุ้นหรือสภาพแวดล้อมที่ชักนำให้กลับไปเสพ ซึ่งจัดเป็น Cues to action (สิ่งกระตุ้นให้เกิดการปฏิบัติ) ใน Health Belief Model (HBM) เนื่องจากสภาพแวดล้อมทางสังคมส่งผลต่อความพร้อมในการปรับพฤติกรรม ส่วนข้อ A ผิดเพราะ Perceived benefits คือการรับรู้ประโยชน์ของการเลิก ข้อ B ผิดเพราะ Perceived barrier คือการรับรู้อุปสรรคในการเลิก ข้อ C ผิดเพราะ Perceived Severity คือการรับรู้ความรุนแรงของโทษยาบ้า และข้อ E ผิดเพราะ Perceived Susceptibility คือการรับรู้โอกาสเสี่ยงต่อผลเสีย Clinical Pearl: Cues to action can be internal (symptoms) or external (advice, social environment).	["COMMED_48MCQ"]
COMMED_48MCQ_6	14. ฟ้าอยากเลิกยาเสพติด เลยเลิกคบกับเพื่อนที่เสพยาด้วยกัน เป็น Health Belief model แบบไหน		Perceived Barriers///Perceived Benefits///Perceived Severity///Cues to Action///Self-Efficacy	Cues to Action	เช่นเดียวกับข้อก่อนหน้า การตัดปัจจัยกระตุ้นจากคนรอบข้าง (Social cues) เพื่อช่วยในการเปลี่ยนพฤติกรรมจัดอยู่ในหมวด Cues to Action ส่วนข้อ A ผิดเพราะ Barriers คือปัญหาที่ขวางการเปลี่ยนพฤติกรรม ข้อ B ผิดเพราะ Benefits คือข้อดีที่ได้รับ ข้อ C ผิดเพราะ Severity คือความน่ากลัวของโรค/ยา และข้อ E ผิดเพราะ Self-Efficacy คือความมั่นใจในตนเองว่าจะทำสำเร็จ Clinical Pearl: การจัดการสิ่งแวดล้อมเพื่อลดแรงกระตุ้นคือหัวใจของ Cues to Action	["COMMED_48MCQ"]
COMMED_48MCQ_7	15. คุณยายอายุ 70 ล้มกระดูกสะโพกหัก มีอาการนอนไม่หลับ และกินยาทุกวัน ถามว่าข้อไหนส่งผลทำให้เกิดเหตุการณ์ดังกล่าวน้อยที่สุด		ยา///โรคประจำตัว///อายุ///ความช่วยเหลือจากชุมชน///สภาพแวดล้อมภายในบ้าน	ความช่วยเหลือจากชุมชน	วิเคราะห์ปัจจัยที่ทำให้เกิดการล้ม (Risk factors for falls) ในผู้สูงอายุ ได้แก่ อายุ (เสื่อมตามวัย), โรคประจำตัว (เวียนศีรษะ), ยา (Sedatives ทำให้น่วง), และสภาพแวดล้อม (พื้นลื่น/แสงสว่างไม่พอ) ซึ่งล้วนเป็นสาเหตุโดยตรง ส่วนความช่วยเหลือจากชุมชน (Community assistance) จัดเป็นปัจจัยเสริมสร้างความปลอดภัยหรือการช่วยเหลือหลังเกิดเหตุ จึงมีส่วนทำให้เกิดเหตุการณ์นี้น้อยที่สุด Clinical Pearl: Falls in elderly are multifactorial, but 'Community support' is a protective or management factor, not a cause.	["COMMED_48MCQ"]
COMMED_48MCQ_8	16. แพมรู้ว่าความอ้วนทำให้เกิดปัญหาสุขภาพได้ จึงตั้งใจจะเริ่มต้นลดความอ้วนในวันเกิดที่จะถึงนี้ (อีก 5 วัน) ตรงกับ stage of change ใด		Maintenance stage///Action stage///Preparation stage///Contemplation stage///Precontemplation stage	Preparation stage	การที่บุคคลมีความตั้งใจจะเปลี่ยนพฤติกรรมในอนาคตอันใกล้ (ภายใน 30 วัน หรือ 1 เดือน) และเริ่มมีการวางแผนหรือกดยืนยันวันเริ่มต้น เช่น อีก 5 วันข้างหน้า จัดเป็น Preparation stage ส่วนข้อ A ผิดเพราะ Maintenance คือทำมานานกว่า 6 เดือน ข้อ B ผิดเพราะ Action คือกำลังทำอยู่แต่ยังไม่ถึง 6 เดือน ข้อ D ผิดเพราะ Contemplation คือคิดจะทำใน 6 เดือนแต่ยังไม่กำหนดวัน และข้อ E ผิดเพราะ Precontemplation คือยังไม่คิดจะทำเลย Clinical Pearl: Key of Preparation is 'Intending to take action in the immediate future'.	["COMMED_48MCQ"]
COMMED_48MCQ_9	17. โอไมครอน มีอัตราการติดเชื้อสูง และพบว่าการสังสรรในที่อากาศปิดมีอัตราการติดเชื้อสูงกว่ามาก คำถาม: องค์ 3 ในระบาดวิทยาอันไหนเสียสมดุลมากที่สุด		Agent///Host///Environment///Agent and host///Agent and environment	Agent and environment	ใน Epidemiological Triad ความสมดุลเสียไปจากสองส่วนหลัก คือ 1. Agent (สายพันธุ์โอไมครอนมีความสามารถในการแพร่กระจายสูงขึ้น) และ 2. Environment (สถานที่อากาศปิด/Closed space เอื้อต่อการสะสมของละอองเชื้อ) ส่วนข้อ B (Host) แม้จะมีผลแต่โจทย์เน้นที่ตัวเชื้อและสถานที่สังสรรค์ Clinical Pearl: Disease occurs when the balance between Agent, Host, and Environment is disrupted.	["COMMED_48MCQ"]
COMMED_48MCQ_10	19. จากการศึกษาพบว่าในกลุ่มผู้สูงอายุมี incidence rate ในการเสียชีวิตจากโรคโควิด-19 มากกว่าในกลุ่มคนที่อยู่ในวัยทำงาน 3 เท่า การศึกษานี้เป็นการศึกษาแบบใด		Randomized controlled trial///Cohort study///Cross-sectional study///Case-control study///Descriptive study	Cohort study	การศึกษาที่เปรียบเทียบ Incidence rate ระหว่างกลุ่มประชากรที่แตกต่างกัน (Elderly vs Working age) โดยติดตามผลลัพธ์ (เสียชีวิต) ไปข้างหน้าหรือใช้ข้อมูลย้อนหลังที่ระบุเวลาที่เริ่มเสี่ยง จัดเป็นลักษณะของ Cohort study ส่วนข้อ A ผิดเพราะไม่ได้มีการสุ่มแบ่งกลุ่มทดลอง ข้อ C ผิดเพราะ Cross-sectional วัด Prevalence ณ จุดเวลาเดียว ไม่ได้วัด Incidence ข้อ D ผิดเพราะ Case-control เริ่มจากคนที่เป็นโรคแล้วย้อนไปหาเหตุ และข้อ E ผิดเพราะโจทย์มีการเปรียบเทียบ (Analytic) ไม่ใช่แค่การบรรยาย Clinical Pearl: 'Incidence rate comparison' is a hallmark of Cohort studies.	["COMMED_48MCQ"]
COMMED_48MCQ_11	20. ในการวิจัยศึกษาประสิทธิภาพของวัคซีน ตอน Randomization ควรปฎิบัติตามหลักจริยธรรมในการทำวิจัยข้อใด		Justice///Respect for person///Beneficence///Respect for confidentiality///Non-maleficence	Justice	หลักการ Randomization ในการวิจัยทางคลินิกมีวัตถุประสงค์เพื่อลดอคติและให้ผู้เข้าร่วมวิจัยทุกคนมีโอกาสเท่าเทียมกันในการได้รับนวัตกรรมใหม่หรือยาหลอก ซึ่งสอดคล้องกับหลัก Justice (ความยุติธรรม) ในการกระจายประโยชน์และภาระของการวิจัย ส่วนข้อ B คือการเคารพในการตัดสินใจ (Informed consent) ข้อ C คือการคำนึงถึงประโยชน์สูงสุด ข้อ D คือการเก็บความลับ และข้อ E คือการไม่ก่ออันตราย Clinical Pearl: Justice = Fair distribution of benefits and burdens.	["COMMED_48MCQ"]
COMMED_48MCQ_12	21. รูปแบบการวิจัยเชิงสังเกตที่ศึกษาในคนกลุ่มเดียวเป็นการศึกษาแบบใด		Case control study///Cross sectional analytical study///Cohort study///Descriptive study///Randomized control trials	Descriptive study	การวิจัยเชิงสังเกต (Observational study) ที่เน้นศึกษาเพียงกลุ่มเดียวเพื่อบรรยายลักษณะ การกระจาย หรือสถานการณ์ของโรคโดยไม่มีกลุ่มเปรียบเทียบ จัดเป็น Descriptive study เช่น Case series หรือ Descriptive cross-sectional ส่วนข้อ A, B และ C เป็นการวิจัยเชิงวิเคราะห์ (Analytic) ที่ต้องมีกลุ่มเปรียบเทียบ และข้อ E เป็นการวิจัยเชิงทดลอง Clinical Pearl: Descriptive study answers 'Who, Where, When' but not 'Why'.	["COMMED_48MCQ"]
COMMED_48MCQ_13	22. Which observational study design is the most appropriate design for investigation of rare causes?		Cohort study///Cross-sectional study///Case series study///Random control trial///Case control study	Cohort study	For 'Rare exposures' (Rare causes), a Cohort study is the best design because you can specifically select a group exposed to that rare factor and follow them over time. ส่วนข้อ E (Case control study) เหมาะสำหรับ 'Rare outcomes' (Rare diseases). ข้อ B และ C ไม่แข็งแรงพอในการพิสูจน์สาเหตุ และข้อ D ไม่ใช่ observational study. Clinical Pearl: Rare exposure = Cohort, Rare disease = Case-control.	["COMMED_48MCQ"]
COMMED_48MCQ_14	23. จากการศึกษาพบว่า incident rate ของการเสียชีวิตในกลุ่มผู้สูงอายุจากโรคโควิด-19 มากกว่าในกลุ่มคนวัยทำงาน 3 เท่า ผลจากการศึกษานี้ได้จากการศึกษาแบบใด		Descriptive study///Cross sectional study///Cohort study///Case control study///Randomized control trial	Cohort study	การวัดค่า Incident rate (อัตราอุบัติการณ์) และเปรียบเทียบระหว่างกลุ่ม (Comparison of rates) เป็นคุณสมบัติหลักของการศึกษาแบบ Cohort study ซึ่งติดตามกลุ่มประชากรไปตามเวลา ส่วนข้อ A และ B ไม่ได้เน้นการเปรียบเทียบอัตราการเกิดใหม่ในช่วงเวลา ข้อ D เริ่มต้นจากผลไปหาเหตุ และข้อ E คือการทดลองที่มีการสุ่ม Clinical Pearl: Incidence = New cases over person-time = Cohort.	["COMMED_48MCQ"]
COMMED_48MCQ_15	24. โอกาสที่จะได้รับ control treatment หรือ new treatment เท่ากัน เรียกว่าอะไร?		Random selection///Random sample///Random allocation///Random control///Random selection bias	Random allocation	กระบวนการแบ่งกลุ่มผู้เข้าร่วมวิจัยให้ไปอยู่ในกลุ่มทดลองหรือกลุ่มควบคุมโดยที่ทุกคนมีโอกาสได้รับทรีตเมนต์เท่ากันเรียกว่า Random allocation (การจัดสรรแบบสุ่ม) ส่วนข้อ A และ B (Random selection/sample) คือการสุ่มเลือกตัวแทนประชากรเข้าสู่การศึกษา ข้อ D ไม่มีคำนิยามนี้โดยตรง Clinical Pearl: Allocation = Assignment to treatment groups.	["COMMED_48MCQ"]
COMMED_48MCQ_16	25. การทำ double-blind ใน randomized control trial จะลด bias อะไร		Non-response bias///Information bias///Selection bias///Recall bias///Measurement bias	Information bias	การปกปิดข้อมูล (Blinding) ทั้งในฝั่งผู้วิจัยและผู้เข้าร่วมวิจัยมีวัตถุประสงค์เพื่อลด Information bias (โดยเฉพาะ Measurement bias หรือ Observation bias) ที่อาจเกิดขึ้นจากความลำเอียงในการวัดหรือรายงานผลลัพธ์ ส่วนข้อ A และ C (Selection bias) ป้องกันได้ด้วยการสุ่มจัดสรร (Randomization) ข้อ D (Recall bias) มักเกิดใน Case-control Clinical Pearl: Randomization reduces Selection bias, Blinding reduces Information bias.	["COMMED_48MCQ"]
COMMED_48MCQ_17	26. ข้อใดถูกเกี่ยวกับ Outcome measurement		Surrogate outcome คือผลลัพธ์คาดหวังสุดท้าย///ตัวอย่าง surrogate outcome เช่น ระดับ cholesterol ในเลือด///ในงานวิจัยเรื่องประสิทธิผลของยาแก้ปวดตัวใหม่ผลการทดลองที่วัดคือ ระดับ cortisol hormone ในเลือด///ผลการวิจัยพบว่าผู้ป่วยพึงพอใจกับการรักษาโรคลมชักแบบใหม่มากกว่าแบบเดิม 5 เท่า สรุปว่า ควรนาการรักษานี้ไปเผยแพร่///Error type II ( Beta error ) คือการสรุปว่าการรักษาแบบใหม่แตกต่างจากแบบเดิม โดยที่ความจริงไม่ได้แตกต่าง	ตัวอย่าง surrogate outcome เช่น ระดับ cholesterol ในเลือด	Surrogate outcome คือผลลัพธ์ตัวแทนที่วัดได้ง่ายและคาดว่าจะสัมพันธ์กับผลลัพธ์ทางคลินิกสุดท้าย (Ultimate outcome) เช่น การวัดระดับ Cholesterol เพื่อประเมินความเสี่ยงโรคหัวใจ ส่วนข้อ A ผิดเพราะ surrogate ไม่ใช่ผลสุดท้าย ข้อ C การวัด cortisol สำหรับยาแก้ปวดอาจไม่เหมาะสมที่สุด ข้อ D ความพึงพอใจเพียงอย่างเดียวไม่เพียงพอต่อการเผยแพร่การรักษา และข้อ E ผิดเพราะ Error type II คือการหาความต่างไม่เจอทั้งที่มีความต่าง (False negative) Clinical Pearl: Surrogate outcome must be biologically plausible to predict clinical outcome.	["COMMED_48MCQ"]
COMMED_48MCQ_18	27. งานวิจัยเพื่อประเมินผลการให้บริการสุขภาพแก่ผู้ป่วยเบาหวาน ชนิดที่ 2 โดยวิธีการให้ยาลดระดับน้ำตาล วัดผลการทดลองโดยวัดระดับน้ำตาลสะสม haemoglobin A1c พบว่าผู้ป่วยที่ได้รับยาใหม่มีระดับน้ำตาลลดลง แตกต่างจากผู้ที่ไม่ได้เข้าร่วมโครงการอย่างมีนัยสำคัญทางสถิติ (p value <5%) แต่กลุ่มทดลองมีอัตราเข้าห้องฉุกเฉินเพราะระดับน้ำตาลต่ำ มากกว่ากลุ่มที่ไม่ได้เข้าร่วมโครงการอย่างมีนัยสำคัญทางสถิติ (p value <5%) จากการวิจัย ข้อใดถูกต้อง		การวัดระดับน้ำตาลสะสมเป็นการวัดแบบ Ultimate outcome///การวัดอัตราเข้าห้องฉุกเฉินเป็นการวัดแบบ Surrogate outcome///ควรวัดระดับยาในเลือดเพื่อทราบสาเหตุของภาวะน้ำตาลต่ำ///ยาลดระดับน้ำตาลไม่ดีเนื่องจากมีอัตราเข้าห้องฉุกเฉินมากกว่า///การเพิ่มขึ้นของอัตราเข้าห้องฉุกเฉินไม่เกี่ยวข้องกับยาลดระดับน้ำตาล	ยาลดระดับน้ำตาลไม่ดีเนื่องจากมีอัตราเข้าห้องฉุกเฉินมากกว่า	แม้ค่า HbA1c (ซึ่งเป็น Surrogate outcome) จะลดลง แต่ผู้ป่วยกลับมีอัตราการเข้าห้องฉุกเฉินจากภาวะน้ำตาลต่ำ (Hypoglycemia) สูงขึ้นอย่างมีนัยสำคัญ ซึ่งถือเป็นอาการไม่พึงประสงค์ที่รุนแรงและเป็น Clinical/Ultimate outcome ที่สำคัญ ดังนั้นสรุปได้ว่ายานี้อาจมีความเสี่ยงมากกว่าประโยชน์ ส่วนข้อ A ผิดเพราะ HbA1c เป็น surrogate ข้อ B ผิดเพราะ ER visit เป็น clinical outcome Clinical Pearl: Never ignore clinical safety outcomes for the sake of surrogate markers.	["COMMED_48MCQ"]

COMMED_47MCQ_2	2. แพมรู้ว่าตัวเองน้ำหนักเกินซึ่งอาจส่งผลต่อสุขภาพได้เลยอยากจะเริ่มลดน้ำหนักในวันเกิดตัวเอง (อีก 5 วันข้างหน้า) ตอนนี้แพมอยู่ใน stage of change ขั้นไหน?		Precontemplation///Contemplation///Preparation///Action///Maintenance	Preparation	ผู้ป่วยอยู่ในขั้น Preparation เนื่องจากตระหนักถึงปัญหาและมีความตั้งใจที่จะเปลี่ยนแปลงพฤติกรรมในอนาคตอันใกล้ (มักกำหนดภายใน 30 วันข้างหน้า) ในที่นี้คืออีก 5 วัน ส่วนข้อ A ผิดเพราะ Precontemplation คือยังไม่คิดว่าตัวเองมีปัญหา ข้อ B ผิดเพราะ Contemplation คือเริ่มคิดแต่ยังไม่มีแผนการที่แน่นอน ข้อ D ผิดเพราะ Action คือเริ่มลงมือทำแล้วไม่เกิน 6 เดือน ข้อ E ผิดเพราะ Maintenance คือทำต่อเนื่องเกิน 6 เดือน	["COMMED_47MCQ"]

COMMED_47MCQ_10	16. เลือกตัวแทนที่ดีของงานวิจัยเรื่องการศึกษาความชุกของการตั้งครรภ์ในมารดาวัยรุ่น		Quota sampling///Snowball sampling///Purposive sampling///Systematic sampling///Convenient sampling	Systematic sampling	การจะได้ตัวแทนที่ดี (Representativeness) ต้องใช้ Probability sampling ซึ่งในตัวเลือกนี้คือ Systematic sampling เพราะสมาชิกทุกคนมีโอกาสถูกเลือกอย่างเป็นระบบและเท่าเทียม ส่วนข้อ A, B, C, E เป็น Non-probability sampling ซึ่งมีความเสี่ยงต่อ Selection bias สูงและไม่สามารถเป็นตัวแทนที่ดีของประชากรได้ในเชิงสถิติ	["COMMED_47MCQ"]

COMMED_44MCQ_43	80. โดนบอกว่าเป็นโรค แต่ความจริงไม่ได้เป็นโรค หมายความว่าไง		positive error///false positive///true negative///false negative///true positive	false positive	ผลบวกลวง (False positive) คือการที่ผลการตรวจระบุว่าเป็นโรค (Positive) ทั้งที่ในความเป็นจริงผู้ป่วยคนนั้นไม่ได้เป็นโรคนั้น (False) ถือเป็นความผิดพลาดประเภทหนึ่งของการตรวจวินิจฉัย	["COMMED_44MCQ"]
COMMED_44MCQ_44	84. งานวิจัยเชิงคุณภาพควรใช้เมื่อใด		เมื่อต้องการศึกษาสมมติฐาน///เมื่อศึกษาในสังคมหรือชุมชนที่มีอยู่ในบริบทที่ใกล้เคียงกัน///เมื่อต้องการเข้าใจความสำคัญของประชากรที่ศึกษา///เมื่อต้องการตรวจสอบความถูกต้องของงานวิจัยเชิงปริมาณ///เมื่อต้องการสร้างแบบสอบถามสำหรับงานวิจัยเชิงปริมาณที่ยังไม่เคยมีใครทำมาก่อน	เมื่อต้องการสร้างแบบสอบถามสำหรับงานวิจัยเชิงปริมาณที่ยังไม่เคยมีใครทำมาก่อน	งานวิจัยเชิงคุณภาพ (Qualitative research) มักใช้ในระยะสำรวจเพื่อทำความเข้าใจปรากฏการณ์ในมุมลึก ข้อมูลที่ได้จากบทสัมภาษณ์หรือการสังเกตสามารถนำมาพัฒนาเป็นข้อคำถามในแบบสอบถามเพื่อใช้ในงานวิจัยเชิงปริมาณในระดับกว้างต่อไปได้	["COMMED_44MCQ"]
COMMED_44MCQ_45	85. ข้อใดคือข้อแตกต่างของเศรษฐศาสตร์กับเศรษฐศาสตร์สาธารณสุข		Input///Process///Outcome///Resources///Output	Outcome	เศรษฐศาสตร์สาธารณสุขมีความซับซ้อนกว่าเศรษฐศาสตร์ทั่วไปในด้าน Outcome หรือผลลัพธ์ เพราะผลลัพธ์ด้านสุขภาพ (เช่น QALY, ความอายุยืน) มีความไม่แน่นอนสูง วัดเป็นตัวเงินได้ยาก และส่งผลกระทบภายนอก (Externality) ต่อผู้อื่นได้ชัดเจนกว่าสินค้าทั่วไป	["COMMED_44MCQ"]

COMMED_44MCQ_47	90. What is indirect cost of traffic accident		Transportation cost///Cost of Premature death///Cost of hospitalization///Cost of Emergency service///Cost of facilities and informal health care	Cost of Premature death	Indirect cost (ต้นทุนทางอ้อม) คือต้นทุนการเสียโอกาสหรือสูญเสียความสามารถในการผลิตจากการเจ็บป่วยหรือเสียชีวิต การตายก่อนวัยอันควร (Premature death) ทำให้ขาดรายได้ที่ควรจะได้ไปตลอดอายุขัย ส่วนค่ารักษา (Hospitalization) หรือค่าขนส่ง (Transportation) จัดเป็นต้นทุนทางตรง (Direct cost)	["COMMED_44MCQ"]
COMMED_43MCQ_1	1. What is primary prevention?		มานะกินยาอย่างสม่ำเสมอ///มานีฉีดวัคซีน influenza///ปีติใส่เฝือกหลังจากแขนหัก///ชูใจฝึกใช้ไม้ค้ำยันในการเดินหลังประสบอุบัติเหตุ///สมหมายกินยาและออกกำลังกายเพื่อลดระดับน้ำตาลในเลือด	มานีฉีดวัคซีน influenza	Primary prevention คือการป้องกันก่อนการเกิดโรคเพื่อลดอุบัติการณ์ (Incidence) โดยการฉีดวัคซีน Influenza เป็นการสร้างภูมิคุ้มกัน (Specific protection) ส่วนข้อ A และ E เป็น Tertiary prevention เพราะเป็นการดูแลรักษาโรคที่เป็นแล้วเพื่อป้องกันภาวะแทรกซ้อน ส่วนข้อ C และ D เป็นการฟื้นฟูสภาพ (Rehabilitation) ซึ่งจัดเป็น Tertiary prevention เช่นกัน Clinical Pearl: การป้องกันระดับปฐมภูมิมุ่งเน้นที่คนปกติเพื่อไม่ให้ป่วย	["COMMED_43MCQ"]
COMMED_43MCQ_2	2. ในการลงสำรวจชุมชน ข้อใดเป็นข้อมูลปฐมภูมิ		การสร้างข้อมูลจากข้อมูลเดิมที่มีอยู่แล้ว///การสำรวจโดยการสร้างแบบสอบถาม///การทำงานวิจัยเชิงคุณภาพหรือปริมาณ///การนำข้อมูลเดิมมาใช้///การวิเคราะห์ข้อมูลของโรงพยาบาลชุมชน	การสำรวจโดยการสร้างแบบสอบถาม	ข้อมูลปฐมภูมิ (Primary data) คือข้อมูลที่ผู้เก็บรวบรวมได้มาด้วยตนเองโดยตรงจากการลงพื้นที่จริง เช่น การทำแบบสอบถาม (Questionnaire) หรือการสัมภาษณ์ ส่วนข้อ A, D และ E เป็นการใช้ข้อมูลที่มีการบันทึกไว้ก่อนแล้ว (Secondary data) ส่วนข้อ C คือประเภทของงานวิจัยไม่ใช่แหล่งที่มาของข้อมูลโดยตรงในบริบทนี้	["COMMED_43MCQ"]
COMMED_43MCQ_3	3. DASH Diet (Dietary Approaches to Stop Hypertension) มีสารใดบ้าง		K+, Ca2+, Mg2+///Na+, K+, Fe2+///Ca2+, Zn2+, Vitamin B///Mg2+, Na+, Iodine///Vitamin A, C, E	K+, Ca2+, Mg2+	อาหารแบบ DASH Diet เน้นการลดความดันโลหิตโดยการเพิ่มแร่ธาตุที่ช่วยลดความตึงตัวของหลอดเลือด ได้แก่ Potassium (K+), Calcium (Ca2+), และ Magnesium (Mg2+) ร่วมกับการจำกัด Sodium (เกลือ) ส่วนข้ออื่นๆ มีการใส่ Sodium (ข้อ B, D) หรือสารที่ไม่ใช่หัวใจหลักของ DASH (ข้อ C, E) เข้ามาจึงผิดหลักการหลัก	["COMMED_43MCQ"]
COMMED_43MCQ_4	4. ข้อใดถูกต้องเกี่ยวกับ strength training		ไม่เหมาะกับผู้สูงอายุ///ควรทำ 2-3 วันครั้ง///ควรทำสัปดาห์อย่างน้อยละ 150 นาที///ควรทำวันละ 60 นาทีทุกวัน///ควรใส่รองเท้าขณะออกกำลังกาย	ควรทำ 2-3 วันครั้ง	Strength training หรือการฝึกความแข็งแรงของกล้ามเนื้อ แนะนำให้ทำอย่างน้อย 2-3 วันต่อสัปดาห์โดยมีวันพักคั่นเพื่อให้กล้ามเนื้อฟื้นตัว ส่วนข้อ A ผิดเพราะผู้สูงอายุควรทำเพื่อป้องกันมวลกล้ามเนื้อลดลง (Sarcopenia) ข้อ C เป็นเกณฑ์ของ Aerobic exercise (150 นาที/สัปดาห์) ส่วนข้อ E แม้จะเป็นความจริงทั่วไปแต่ไม่ใช่หลักการทางสรีรวิทยาของการฝึกความแข็งแรงโดยเฉพาะ	["COMMED_43MCQ"]
COMMED_43MCQ_5	5. ครอบครัวในสังคมไทยในยุคปัจจุบันมีความเครียดที่เพิ่มขึ้นจากสาเหตุใดมากที่สุด		ภรรยาออกไปทำงานนอกบ้านมากขึ้น///สังคมมีครอบครัวเดี่ยวเพิ่มขึ้น///ครอบครัวไม่มีความสามารถให้กำเนิดบุตรได้///อยู่กันโดยไม่มีการจดทะเบียนสมรส///จำนวนสมาชิกในครอบครัวเพิ่มขึ้น	สังคมมีครอบครัวเดี่ยวเพิ่มขึ้น	การเปลี่ยนจากครอบครัวขยาย (Extended family) มาเป็นครอบครัวเดี่ยว (Nuclear family) ทำให้ขาดระบบสนับสนุน (Social support) จากญาติพี่น้องในการดูแลสมาชิกหรือแชร์ปัญหา ส่งผลให้เกิดความเครียดสะสมได้ง่ายกว่า ส่วนข้อ A, D, E เป็นปัจจัยรอง ส่วนข้อ C เป็นปัญหาเฉพาะบุคคลมากกว่าปัญหาระดับสังคมโดยรวม	["COMMED_43MCQ"]
COMMED_43MCQ_6	6. A woman may have the mental change while pregnancy. Which one would be the most appropriate solution?		Hobby///Exercise///Psychiatrist///Eating healthy food///Explain to her family	Explain to her family	ในช่วงตั้งครรภ์ หญิงตั้งครรภ์จะมีการเปลี่ยนแปลงทางอารมณ์จากระดับฮอร์โมน การให้ความรู้และความเข้าใจแก่ครอบครัว (Family support) เป็นสิ่งสำคัญที่สุดเพื่อให้เกิดความเข้าใจและดูแลอย่างเหมาะสม ส่วนข้อ A, B, D เป็นการช่วยผ่อนคลายเบื้องต้น และข้อ C (จิตแพทย์) จะใช้ในกรณีที่มีความผิดปกติรุนแรงเช่น Peripartum depression	["COMMED_43MCQ"]
COMMED_43MCQ_7	7. Who has the highest risk to have peptic ulcer disease?		Schizophrenia///Bipolar disorder///Anxiety disorder///Personality disorder///Major depressive disorder	Anxiety disorder	Peptic ulcer disease (PUD) มีความสัมพันธ์อย่างมากกับความเครียดผ่านกลไก Psychosomatic factors ซึ่ง Anxiety disorder จะกระตุ้นระบบประสาท Autonomic ให้หลั่งกรดในกระเพาะอาหารมากขึ้น ส่วนโรคอื่นๆ เช่น Schizophrenia หรือ Bipolar เน้นความผิดปกติของ Dopamine หรือ Mood control ซึ่งส่งผลต่อการเกิดแผลทางเดินอาหารน้อยกว่าภาวะวิตกกังวลเรื้อรัง	["COMMED_43MCQ"]
COMMED_43MCQ_8	8. ข้อใดถูกต้องที่สุด เมื่อมีคนในครอบครัวเจ็บป่วย		ทุกครอบครัวมีการปรับสมดุลครอบครัวเพื่อเข้าสู่สมดุลใหม่///ไม่มีการเปลี่ยนแปลง///ลูกที่มีรายได้สูงสุดเป็นคนดูแล///แพทย์เข้าไปมีส่วนช่วย///เมื่อมีการเจ็บป่วย ครอบครัวที่มีรายได้น้อยจะมีปัญหาอื่นๆตามมามากกว่าครอบครัวที่มีรายสูง	ทุกครอบครัวมีการปรับสมดุลครอบครัวเพื่อเข้าสู่สมดุลใหม่	ตามทฤษฎี Family Systems Theory เมื่อมีสมาชิกคนหนึ่งเจ็บป่วย จะกระทบต่อสมดุลเดิม (Homeostasis) ทำให้ครอบครัวต้องเปลี่ยนบทบาทหน้าที่เพื่อสร้างสมดุลใหม่ (New homeostasis) ส่วนข้อ B ผิดเพราะทุกความเจ็บป่วยย่อมเกิดการเปลี่ยนแปลง ข้อ C ไม่จำเป็นเสมอไป และข้อ E แม้จะเป็นความจริงทางเศรษฐกิจแต่ไม่ใช่หลักการทางครอบครัวที่ถูกต้องที่สุดในเชิงจิตสังคม	["COMMED_43MCQ"]
COMMED_43MCQ_9	9. ข้อใดเป็นปัจจัยของครอบครัวที่ส่งผลต่อความเจ็บป่วยน้อยที่สุด		ความชุก///ความรัก///ความเชื่อ///ความเครียด///การรักษา	ความชุก	ความชุก (Prevalence) เป็นข้อมูลทางระบาดวิทยาระดับประชากร (Population level) จึงมีผลต่อการเปลี่ยนแปลงพฤติกรรมหรือความเจ็บป่วยในระดับครอบครัวรายบุคคลน้อยที่สุด เมื่อเทียบกับปัจจัยภายในครอบครัวอย่าง ความรัก ความเชื่อ ความเครียด และการเข้าถึงการรักษาซึ่งส่งผลโดยตรงต่อพยากรณ์โรค	["COMMED_43MCQ"]
COMMED_43MCQ_10	10. ข้อใดเป็นการเฝ้าระวังโรคที่ทำให้ลดอุบัติการณ์และความรุนแรงของโรคมากสุด		รายงานการระบาดโรค SARs ภายใน 24 ชม///คัดกรองโดยการวัดอุณหภูมิคนในสนามบินเพื่อป้องกันไข้หวัดใหญ่///คัดกรองโดยการดูผื่นเพื่อป้องกัน measles ในคนที่ไปเยี่ยมผู้ป่วยที่ได้รับยาเคมีบำบัด///แพทย์ทุกคนควรตรวจ CXR ป้องกัน TB///การเก็บข้อมูลสถิติประจำปี	รายงานการระบาดโรค SARs ภายใน 24 ชม	การรายงานโรคที่รวดเร็ว (Timely reporting) สำหรับโรคติดต่ออันตรายอย่าง SARS ภายใน 24 ชม. ช่วยให้ทีมสอบสวนโรคลงพื้นที่กักกันโรคได้ทันท่วงที จึงลดการแพร่กระจายและอุบัติการณ์ใหม่ได้ดีที่สุด ส่วนข้อ B มีความไวต่ำ ข้อ C เป็นการป้องกันเฉพาะจุด และข้อ D การทำ CXR ทุกคน (Mass screening) ไม่คุ้มค่าและไม่ลดอุบัติการณ์ได้เท่าการควบคุมการระบาดอย่างรวดเร็ว	["COMMED_43MCQ"]
COMMED_43MCQ_11	11. ข้อใดเป็นนิยามของโรคระบาด		โรคที่เกิดขึ้นมากอย่างรวดเร็วในระยะเวลาอันสั้นอย่างผิดปกติไปจากลักษณะเดิมที่เคยเป็นอยู่ในชุมชนนั้น///โรคที่พบประจำในท้องถิ่นนั้นๆ///การพบผู้ป่วยประปรายในพื้นที่///โรคที่แพร่กระจายไปทั่วโลก///โรคที่เกิดจากเชื้อไวรัสเท่านั้น	โรคที่เกิดขึ้นมากอย่างรวดเร็วในระยะเวลาอันสั้นอย่างผิดปกติไปจากลักษณะเดิมที่เคยเป็นอยู่ในชุมชนนั้น	นิยามของ Outbreak หรือ Epidemic คือการพบจำนวนผู้ป่วยเกินกว่าค่าปกติ (Expected cases) ที่เคยพบในพื้นที่และช่วงเวลานั้นๆ ส่วนข้อ B คือ Endemic (โรคประจำถิ่น) ข้อ C คือ Sporadic (โรคประปราย) และข้อ D คือ Pandemic (การระบาดใหญ่ทั่วโลก)	["COMMED_43MCQ"]

COMMED_43MCQ_14	14. ข้อใดถูกต้องเกี่ยวกับ Qualitative study		Countable form///Describe phenomenon///Can be present with graph///Collecting data from lab///Need clearly definition	Describe phenomenon	หัวใจของงานวิจัยเชิงคุณภาพ (Qualitative study) คือการอธิบายปรากฏการณ์ (Describe phenomenon) ความหมาย และบริบทจากมุมมองของผู้ถูกศึกษา ส่วนข้อ A, C, D เป็นลักษณะเด่นของงานวิจัยเชิงปริมาณ (Quantitative study) ที่เน้นตัวเลข สถิติ และผล Lab	["COMMED_43MCQ"]
COMMED_43MCQ_15	16. What is soft outcome?		Effect of alcohol consumption on DM///Prevalence of cholangiocarcinoma in Thailand///Attitude towards safety helmet among construction work///Health seeking behavior among foreign worker in Samutsakorn///Incidence of COVID-19	Attitude towards safety helmet among construction work	Soft outcome คือตัวแปรที่วัดได้ยากหรือมีความเป็นอัตวิสัย (Subjective) เช่น ทัศนคติ (Attitude) ความพึงพอใจ หรือคุณภาพชีวิต ส่วน Hard outcome คือสิ่งที่วัดเป็นตัวเลขชัดเจน มีเกณฑ์วินิจฉัยแน่นอน เช่น อัตราอุบัติการณ์ (Incidence) หรือผล Lab ทางคลินิก	["COMMED_43MCQ"]
COMMED_43MCQ_16	17. ข้อใดคือ subjective measurement		Quality of life in breast cancer patient///Hypertension///Dyslipidemia///Sign of Chronic liver disease///Body weight	Quality of life in breast cancer patient	Subjective measurement คือการวัดที่ต้องพึ่งพาความรู้สึกหรือการรายงานจากตัวผู้ป่วยเอง (Patient-reported) เช่น คุณภาพชีวิต (Quality of life) ส่วนข้อ B, C, D และ E เป็น Objective measurement เพราะวัดได้ด้วยเครื่องมือแพทย์และมีค่าตัวเลขที่แน่นอน (Blood pressure, Lipid profile, Physical signs, Weight)	["COMMED_43MCQ"]
COMMED_43MCQ_17	18. Which variable is measured by ratio scale?		Body weight///Temperature///Education level///Hospital number///Telephone number	Body weight	Ratio scale เป็นระดับการวัดสูงสุดที่มี 'ศูนย์แท้' (True zero) และสามารถเปรียบเทียบเป็นจำนวนเท่าได้ เช่น น้ำหนัก (Body weight) ส่วน Temperature ในหน่วยเซลเซียสเป็น Interval scale (ไม่มีศูนย์แท้) Education level เป็น Ordinal และ Hospital/Telephone number เป็น Nominal scale	["COMMED_43MCQ"]
COMMED_43MCQ_18	19. Which is scale of measurement in case of Qualitative variable?		Ordinal, Ratio///Ratio, Interval///Ratio, Nominal///Interval, Nominal///Nominal, Ordinal	Nominal, Ordinal	ตัวแปรเชิงคุณภาพ (Qualitative/Categorical variable) จะวัดได้ในระดับ Nominal (จำแนกกลุ่ม เช่น เพศ) และ Ordinal (เรียงลำดับ เช่น ระดับความรุนแรง) ส่วน Interval และ Ratio ใช้สำหรับตัวแปรเชิงปริมาณ (Quantitative/Numerical variable)	["COMMED_43MCQ"]
COMMED_43MCQ_19	20. ข้อใดเป็นประโยชน์ของการทำแผนภูมิครอบครัวน้อยที่สุด		แพทย์ได้สร้างสัมพันธ์ที่ดีกับคนในครอบครัว///เข้าใจลักษณะของครอบครัวที่เปลี่ยนแปลงไปตามกาลเวลา///ได้รู้ว่ามีคนในครอบครัวเป็นโรคใดบ้าง///ได้รู้วิธีการแนะนำเรื่องด้านพฤติกรรมสุขภาพแก่คนในครอบครัว///ได้รู้และเข้าใจว่าทำไมคนไข้ถึงไม่ทำตามคำแนะนำในการรักษา	ได้รู้และเข้าใจว่าทำไมคนไข้ถึงไม่ทำตามคำแนะนำในการรักษา	ประโยชน์หลักของ Genogram คือการเห็นภาพรวมสุขภาพทางพันธุกรรม (ข้อ C) โครงสร้างความสัมพันธ์ (ข้อ A, B) และบริบทสุขภาพ (ข้อ D) แต่เรื่องความร่วมมือในการรักษา (Compliance/Adherence) มักต้องอาศัยการประเมินจากปัจจัยรายบุคคลและแรงจูงใจมากกว่าแค่การดูผังครอบครัวเพียงอย่างเดียว	["COMMED_43MCQ"]
COMMED_43MCQ_20	21. คำอธิบายสัญลักษณ์ในแผนภูมิครอบครัวนี้หมายถึงข้อใด	https://drive.google.com/uc?export=view&id=1FbTTybGi4T4YPr5R-4od-MFqcZd6mi6f	ฝ่ายชายทะเลาะกับฝ่ายหญิง///ฝ่ายหญิงควบคุมบงการฝ่ายชาย///ฝ่ายชายมีอำนาจเหนือฝ่ายหญิง///ฝ่ายหญิงถูกกระทำความรุนแรง///ฝ่ายชายถูกกระทำความรุนแรง	ฝ่ายชายถูกกระทำความรุนแรง	ในแผนภูมิครอบครัว (Genogram) สัญลักษณ์สี่เหลี่ยม (ชาย) ที่มีหัวลูกศรจากวงกลม (หญิง) ชี้หา พร้อมเส้นหยักแสดงถึงทิศทางของการกระทำความรุนแรง (Interpersonal violence) โดยฝ่ายชายเป็นผู้ถูกกระทำ (Recipient) ส่วนข้ออื่นๆ ไม่ตรงตามทิศทางของสัญลักษณ์ลูกศรที่ปรากฏ	["COMMED_43MCQ"]

COMMED_43MCQ_22	25. ในการสัมภาษณ์เชิงลึกของการศึกษาวิจัยเชิงคุณภาพ จะมีการหยุดสัมภาษณ์ไม่ถามต่อเมื่อคำตอบของแต่ละคนเริ่มเหมือนกันมากขึ้น และสรุปผลได้ หมายความว่าข้อมูลที่ได้เป็นอย่างไร		ข้อมูลอิ่มตัว///ข้อมูลมากเกิน///ข้อมูลเพียงพอ///ข้อมูลเข้าสู่ภาวะวิกฤติ///ข้อมูลมีความสำคัญทางสถิติ	ข้อมูลอิ่มตัว	Data saturation (ข้อมูลอิ่มตัว) คือจุดที่การเก็บข้อมูลเพิ่มเติมไม่ได้ให้ข้อมูลใหม่ที่เป็นประโยชน์อีกแล้ว ผู้ถูกให้สัมภาษณ์ตอบซ้ำๆ กัน ซึ่งเป็นเกณฑ์ในการหยุดเก็บข้อมูลของงานวิจัยเชิงคุณภาพ ส่วน Statistical significance (ข้อ E) เป็นเกณฑ์ของงานวิจัยเชิงปริมาณเท่านั้น	["COMMED_43MCQ"]

COMMED_43MCQ_29	32. ชายอายุ 21 ปี มาด้วยอาการ heat cramp อาการดังกล่าวมีสาเหตุมาจากอะไร		Hypovolemia///Hypocalcemia///Hyponatremia///Hypercalcemia///Hypernatremia	Hyponatremia	Heat cramp เกิดจากการเสียเหงื่อปริมาณมากและทดแทนด้วยน้ำเปล่าเพียงอย่างเดียว ทำให้เกิดภาวะโซเดียมในเลือดต่ำ (Hyponatremia) และเกิดตะคริวตามกล้ามเนื้อ ส่วน Hypocalcemia (ข้อ B) เป็นสาเหตุของตะคริวทั่วไปแต่ไม่ใช่กลไกหลักของ Heat-related illnesses	["COMMED_43MCQ"]

COMMED_43MCQ_33	37. In the cohort study of liver cancer, researchers include 10 participants who risk at liver cancer into the study. After follow-up for 10 years, only 4 participants developed liver cancer at 5th year. Other participants were free of cancer until the end of the study. What is person-time incidence rate of liver cancer in this study?		4/6///4/10///4/20///4/60///4/80	4/80	การคำนวณ Person-time: คนที่เกิดโรคมะเร็ง 4 คน อยู่ในศึกษากลุ่มละ 5 ปี = 20 person-years. อีก 6 คนที่เหลือไม่เป็นโรค อยู่จนครบ 10 ปี = 60 person-years. รวมทั้งหมด = 80 person-years. อัตราอุบัติการณ์ (Incidence rate) = จำนวนผู้ป่วยใหม่ (4) / Person-time (80) = 4/80	["COMMED_43MCQ"]
COMMED_43MCQ_34	38. The result of cohort study of new-set diabetic mellitus in 10 participants who were at risk in diabetic for 4 years showed as follows. What is the point prevalence at end of study?	https://drive.google.com/uc?export=view&id=1MZGS6zn3JU9tElAaQ20JKlTR4YRb0JBz	40.00 %///44.40 %///50.00 %///55.60 %///60.00 %	55.60 %	Point prevalence (ความชุก ณ จุดเวลาใดเวลาหนึ่ง) คำนวณจากจำนวนผู้ป่วยที่มีอยู่ ณ เวลานั้น หารด้วยประชากรทั้งหมดที่ยังอยู่ในการศึกษา ณ เวลานั้น จากข้อมูลในกราฟ (สิ้นสุดปีที่ 4) มีผู้เข้าร่วมเริ่มต้น 10 คน เกิดโรค (Diabetic mellitus) 6 คน และไม่เกิดโรค 4 คน แต่มีผู้ป่วย 1 คนเกิด Loss to follow-up ไปก่อนจะสิ้นสุดการศึกษา ทำให้ ณ ปลายปีที่ 4 มีประชากรเหลืออยู่ในระบบทั้งหมดเพียง 9 คน (10 - 1) และเป็นผู้ป่วยที่ยังคงอยู่ 5 คน (6 - 1) ดังนั้น Point prevalence = 5/9 = 55.55...% หรือปัดเป็น 55.60% จึงเป็นคำตอบที่ถูกต้องที่สุด ส่วนข้อ C (50.00%) ผิดเพราะใช้ตัวหารเป็น 10 โดยไม่ได้หักคนที่หายไปออก ส่วนข้อ E (60.00%) ผิดเพราะใช้จำนวนคนป่วยทั้งหมด (6) หารด้วยประชากรเริ่มต้น (10) และข้อ A (40.00%) ผิดเพราะใช้คนที่ไม่เป็นโรค (4) มาคำนวณ Clinical Pearl: การหาค่า Point prevalence ในงานวิจัย Cohort ต้องระวังเรื่อง Attrition เสมอ ตัวหาร (Denominator) ต้องเป็นประชากรที่ติดตามได้จริง ณ จุดเวลานั้นเท่านั้น	["COMMED_43MCQ"]

COMMED_43MCQ_36	40. A retrospective cohort study about the risk of developing ovarian cancer and hair dye using has shown the relative risks of 1.67 and 95% incidence CI (0.59,2.14). What is the risk of developing ovarian cancer by using hair dye?		Increase///Decrease///Hair dye use helps protecting against ovarian cancer.///Hair dye use has partial risk of developing ovarian cancer.///The risk of ovarian cancer is not different in people who use dye hair comparing with people who do not use.	The risk of ovarian cancer is not different in people who use dye hair comparing with people who do not use.	ค่า 95% Confidence Interval (CI) ของ Relative Risk (RR) คือ (0.59, 2.14) ซึ่งมีค่าครอบคลุม '1' หมายความว่าไม่มีนัยสำคัญทางสถิติ (Not statistically significant) สรุปได้ว่าความเสี่ยงระหว่างกลุ่มที่ใช้และไม่ใช้สีย้อมผมไม่มีความแตกต่างกันอย่างมีนัยสำคัญ	["COMMED_43MCQ"]
COMMED_43MCQ_37	42. Which one is the most appropriate study for rare disease?		Case-control study///Cohort study///Randomized controlled trial///Non-randomized controlled trial///Cross-sectional study	Case-control study	Case-control study เหมาะสำหรับโรคที่หายาก (Rare disease) เพราะผู้วิจัยสามารถเลือกผู้ที่เป็นโรคมาศึกษาได้เลยแล้วย้อนกลับไปดูปัจจัยเสี่ยง (Retrospective) ส่วน Cohort study จะไม่คุ้มค่าเพราะต้องติดตามคนจำนวนมหาศาลเพื่อรอให้เกิดโรคที่หายากนั้น	["COMMED_43MCQ"]
COMMED_43MCQ_38	43. New drug can treat pulmonary tuberculosis about 60%. Standard treatment can treat pulmonary tuberculosis only about 40%. What is the absolute risk reduction?		5%///20%///33%///66%///80%	20%	Absolute Risk Reduction (ARR) คำนวณจากความแตกต่างของอัตราการตอบสนองต่อการรักษา (หรือความเสี่ยง) โดยตรง: 60% (Drug) - 40% (Standard) = 20%. ส่วน Relative Risk Reduction (RRR) จะเป็นการหาว่าลดลงกี่เท่าจากค่าพื้นฐาน	["COMMED_43MCQ"]
COMMED_43MCQ_39	44. The research in 200 participants recorded that the new drug prevents 70 participants from cardiovascular complications and placebo prevents 20 participants from cardiovascular complications. The researcher divides participants into 2 groups equally. What is number needed to treat of the new drug?		1///2///3///4///5	2	แต่ละกลุ่มมี 100 คน. อัตราการเกิดภาวะแทรกซ้อน (Risk) ในกลุ่มยา = (100-70)/100 = 0.3. กลุ่ม Placebo = (100-20)/100 = 0.8. ARR = 0.8 - 0.3 = 0.5. NNT = 1/ARR = 1/0.5 = 2 คน.	["COMMED_43MCQ"]
COMMED_43MCQ_40	45. The research is about using exercise to prevent falling in elderly. Researchers recruit 200 participants and equally divide them into treat and control groups. 2 of control group participants fell at home while 3 participants with exercise fell at home. What is the relative risk reduction?		1%///2%///3%///33%///67%	1%	โจทย์ข้อนี้ตามตัวเลขอาจจะสื่อถึง Absolute risk reduction มากกว่า เนื่องจาก Relative risk reduction มักให้ค่าเป็นเปอร์เซ็นต์ที่สูงกว่าเมื่อเทียบสัดส่วน หรืออาจมีการบันทึกโจทย์คลาดเคลื่อน (ถ้า 3 คนในกลุ่มออกกำลังกายล้ม และ 2 คนในกลุ่มควบคุมล้ม หมายความว่าการออกกำลังกายเพิ่มความเสี่ยง)	["COMMED_43MCQ"]

COMMED_43MCQ_63	72. การทดลองให้ ketogenic diet มีผลช่วย DM หรือไม่ โดยให้กลุ่ม control ใช้ conventional therapy ผลปรากฏว่ากลุ่ม ketogenic diet มีผลการควบคุม DM ได้น้อยกว่า ถามไปถามมาคือ กลุ่มทดลองไม่ยอมกินอาหารที่กำหนด เพราะมันไม่อร่อย ข้อใดอธิบายเรื่องนี้ได้ดีที่สุด		Compliance///Confirmation///Confounding///Contamination///Co-intervention	Compliance	ปัญหาที่ผู้ร่วมวิจัยไม่ปฏิบัติตามคำแนะนำหรือแผนการรักษาที่กำหนด (เช่น ไม่กินอาหารตามสูตรเพราะไม่อร่อย) เรียกว่าความไม่ร่วมมือในการรักษา หรือ Poor compliance (Adherence) ซึ่งส่งผลกระทบโดยตรงต่อผลการศึกษา	["COMMED_43MCQ"]

COMMED_43MCQ_66	75. Which is the most affected external validity?		Subject selection bias///Compliance///Contaminate///Co-intervention///Demographic population	Demographic population	External validity หรือความสามารถในการนำผลการศึกษาไปประยุกต์ใช้กับประชากรกลุ่มอื่นในโลกความเป็นจริงนั้น ขึ้นอยู่กับความเป็นตัวแทนของกลุ่มตัวอย่างที่นำมาศึกษา (Generalizability) ซึ่ง Demographic population เป็นปัจจัยสำคัญที่สุด เพราะหากลักษณะทางประชากรของกลุ่มศึกษา (เช่น อายุ เพศ เชื้อชาติ หรือความรุนแรงของโรค) แตกต่างจากประชากรทั่วไปอย่างมีนัยสำคัญ จะทำให้ไม่สามารถสรุปผลแบบกว้างๆ ได้ ต่างจากข้อ A, B, C และ D ซึ่งส่วนใหญ่เป็นปัญหาในแง่ของ Internal validity โดย Subject selection bias มักส่งผลต่อความเป็นตัวแทนในเชิงคุณภาพแต่ไม่ใช่ประเด็นหลักของ demographic profile ส่วน Compliance (ความร่วมมือในการรักษา), Contamination (กลุ่มควบคุมได้รับสารทดลอง), และ Co-intervention (การได้รับรักษาอื่นร่วมด้วย) เป็นปัจจัยที่ขัดขวางความแม่นยำภายในของการทดลองนั้นๆ (Internal validity) ทำให้การสรุปสาเหตุและผลลัพธ์ (Causality) ภายในงานวิจัยมีความคลาดเคลื่อน แต่ไม่ได้จำกัดความสามารถในการนำไปประยุกต์ใช้กับประชากรภายนอกในวงกว้างเหมือนกับประเด็นด้าน Demographic population.	["COMMED_43MCQ"]

COMMED_43MCQ_73	89. What is true for Cost Minimization Analysis/ Cost Identification Analysis?		Costs were compared.///Cost maximize as much as possible.///Outcomes were carefully compared.///Units of outcome should be transformed to be monetary unit.///The outcomes of the alternatives are different units in measurement.	Costs were compared.	Cost-Minimization Analysis (CMA) จะใช้เมื่อเปรียบเทียบทางเลือกที่มีผลลัพธ์ (Outcome) เท่ากันหรือเหมือนกันทุกประการ ดังนั้นจึงเปรียบเทียบเฉพาะต้นทุน (Costs) เท่านั้นเพื่อหาทางเลือกที่ประหยัดที่สุด	["COMMED_43MCQ"]

COMMED_52FMT_1	1. A 25-year-old man, who has been working as a car painter for three months, presented to the emergency room with progressive dyspnea and wheezing. Which occupational agent is the most likely cause of his symptoms?		Carbon black///Asbestos///Formaldehyde///Benzene///Toluene diisocyanates	Toluene diisocyanates	ผู้ป่วยมีอาการของ Occupational Asthma (หอบหืดจากการทำงาน) โดยมีอาการ dyspnea และ wheezing สัมพันธ์กับอาชีพช่างพ่นสีรถยนต์ (car painter) ซึ่งสารเคมีกลุ่ม Isocyanates เช่น Toluene diisocyanates (TDI) เป็นสารก่อภูมิแพ้ที่พบบ่อยที่สุดในอุตสาหกรรมพ่นสี ส่วนข้อ A. Carbon black มักสัมพันธ์กับโรคฝุ่นจับปอด (Pneumoconiosis) ข้อ B. Asbestos สัมพันธ์กับ Mesothelioma หรือ Asbestosis ข้อ C. Formaldehyde มักก่อให้เกิดการระคายเคืองทางเดินหายใจส่วนบน และข้อ D. Benzene สัมพันธ์กับโรคทางระบบเลือดเช่น Leukemia มากกว่าอาการหืดหอบฉับพลัน Clinical Pearl: Isocyanates เป็นสาเหตุหลักของหอบหืดในกลุ่มช่างพ่นสีและช่างทำเฟอร์นิเจอร์	["COMMED_52FMT"]
COMMED_52FMT_2	2. A 34-year-old woman working in the shoe factory was exposed to rubber glue. She came to the hospital with a clinical of peripheral muscle weakness and anemia. Physical examination showed wrists drop on both sides. The CBC showed normocytic anemia with slight thrombocytopenia. Which chemical is the most relevant to her presentation?		Lead///Benzene///Asbestos///n-Hexane///Chromium	Lead	ผู้ป่วยมีอาการเด่นคือ Wrist drop (Motor neuropathy) ร่วมกับ Normocytic anemia ซึ่งเป็นลักษณะคลาสสิกของ Lead poisoning (พิษจากตะกั่ว) แม้ว่า n-Hexane จะพบในกาวทำรองเท้าและทำให้เกิด neuropathy ได้บ่อย แต่ n-Hexane มักไม่ทำให้เกิด Anemia ส่วน Benzene (ข้อ B) ทำให้เกิดไขกระดูกฝ่อ (Aplastic anemia) แต่ไม่ทำให้เกิด wrist drop ข้อ C. Asbestos เกี่ยวกับปอด และข้อ E. Chromium เกี่ยวกับแผลที่ผิวหนังหรือมะเร็งปอด ดังนั้นการมีอาการทางระบบประสาทสั่งการร่วมกับซีดจึงชี้เป้าไปที่ Lead มากที่สุด	["COMMED_52FMT"]
COMMED_52FMT_3	3. A 35-year-old male presents to the clinic with symptoms of fatigue, difficulty concentrating, and abdominal pain. He works in a battery manufacturing plant. Which of the following investigation findings is most likely to be true in this patient?		Macrocytic anemia///Low zinc protoporphyrin (ZPP) levels///Basophilic stippling of red blood cells///Elevated serum calcium levels///Blood lead level of 5 mg/dL	Basophilic stippling of red blood cells	ผู้ป่วยทำงานในโรงงานผลิตแบตเตอรี่และมีอาการปวดท้อง (Abdominal colic) ร่วมกับอาการทางระบบประสาท (difficulty concentrating) เข้าได้กับ Lead poisoning ซึ่งการตรวจเลือดมักพบ Microcytic/Normocytic anemia และลักษณะเฉพาะคือ Basophilic stippling ในเม็ดเลือดแดง ส่วนข้อ A ผิดเพราะตะกั่วทำให้เกิด Microcytic/Normocytic ไม่ใช่ Macrocytic ข้อ B ผิดเพราะ ZPP จะสูงขึ้น (High ZPP) ข้อ D ไม่เกี่ยวข้องโดยตรง และข้อ E ผิดเพราะระดับตะกั่ว 5 mg/dL นั้นถือว่าปกติเกินไปสำหรับผู้ที่มีอาการชัดเจนขนาดนี้	["COMMED_52FMT"]
COMMED_52FMT_4	4. A 45-year-old man working in a rice mill was diagnosed with hypersensitivity pneumonitis. Which agent can cause his symptoms?		chlorine gas///moldy hay///phosphine gas///SO2///Methyl bromide	moldy hay	Hypersensitivity pneumonitis (HP) หรือ Farmer's lung เกิดจากการสูดดม organic dust หรือเชื้อราที่อยู่ในผลผลิตทางการเกษตรที่ชื้นแฉะ เช่น moldy hay (หญ้าแห้งที่ขึ้นรา) ซึ่งพบได้ในโรงสีข้าวหรือฟาร์ม ส่วนข้อ A, C, D, และ E เป็นก๊าซพิษหรือสารรมควัน (Fumigants) ที่ก่อให้เกิด Acute lung injury หรือพิษเฉียบพลันในรูปแบบอื่น แต่ไม่ได้ก่อให้เกิดกลไกทางภูมิคุ้มกันแบบ HP	["COMMED_52FMT"]
COMMED_52FMT_5	5. A 45-year-old textile worker presents with increasing shortness of breath and chest tightness, particularly on Mondays upon returning to work after the weekend. These symptoms improve during the week and are minimal on weekends and holidays. Auscultation reveals mild wheezing. Which of the following is the most likely cause of this clinical presentation?		Byssinosis due to inhalation of organic dust.///Allergic bronchopulmonary aspergillosis (ABPA) secondary to fungal contamination in the workplace.///Interstitial lung disease caused by prolonged exposure to synthetic fibers.///Occupational asthma triggered by chemical sensitizers in the textile plant.///Chronic obstructive pulmonary disease (COPD) exacerbated by environmental irritants.	Byssinosis due to inhalation of organic dust.	อาการ Chest tightness ที่เป็นเฉพาะวันจันทร์หลังหยุดงานเสาร์-อาทิตย์ เรียกว่า Monday chest tightness หรือ Monday fever เป็นลักษณะเฉพาะ (Pathognomonic) ของโรค Byssinosis ซึ่งเกิดจากการสูดดมฝุ่นฝ้าย (Cotton dust/Organic dust) ในโรงงานทอผ้า ส่วน ABPA (ข้อ B) มักมีอาการหอบหืดรุนแรงและเงาในปอดที่เปลี่ยนตำแหน่งได้ ข้อ D (Occupational asthma) มักมีอาการสม่ำเสมอเมื่อเจอสารกระตุ้น ไม่จำกัดเฉพาะวันจันทร์อย่างชัดเจนเท่า Byssinosis	["COMMED_52FMT"]
COMMED_52FMT_6	"6. A cardiologist is reviewing strategies for preventing cardiovascular events in high-risk patients. Based on recent data:
